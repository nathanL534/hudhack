  if (trained)      { pill.textContent = "Trained"; pill.className = "side-pill trained"; }
  else if (isBase)  { pill.textContent = "Base";    pill.className = "side-pill base"; }
  else              { pill.textContent = prettyPolicy(m[slot + "_policy"]); pill.className = "side-pill " + (slot === "p1" ? "trained" : "base"); }

  // outcome for this slot
  const oc = slotOutcome(m, slot);
  // theme hook #1: lift+glow the winning panel, recede+dim the losing one. A
  // draw leaves both neutral. (theme.css degrades gracefully if these are absent.)
  const panel = $("panel" + side);   // panelL / panelR
  if (panel) {
    panel.classList.toggle("is-winner", oc === "win");
    panel.classList.toggle("is-loser",  oc === "loss");
  }
  // physical side derives from which panel rendered this slot (L = left, R = right)
  const physicalSide = (side === "L") ? "Left" : "Right";
  const sideLabel = slot.toUpperCase() + " (" + physicalSide + ")";

  let senseiName;
  if (dash && trained)      senseiName = dash.source_teacher_trained ? prettyPolicy(dash.source_teacher_trained) + " Sensei" : "Good Sensei";
  else if (dash && isBase)  senseiName = dash.source_teacher_base ? prettyPolicy(dash.source_teacher_base) + " Sensei" : "Base Sensei";
  else if (trained)         senseiName = "Good Sensei";
  else if (isBase)          senseiName = "Base Sensei";
  else                      senseiName = "—";

  const outcomeTxt = oc === "win" ? "Win" : oc === "loss" ? "Loss" : "Draw";
  const winMark = oc === "win" ? ' <span class="win-mark">勝</span>' : "";
  const outcomeV = outcomeTxt === "—"
    ? '<span class="v dimv">—</span>'
    : `<span class="v">${outcomeTxt}${winMark}</span>`;

  // ----- top (always-visible) summary: Side / Role / Sensei / Outcome -----
  const top = [
    `<div class="spec-row"><span class="k">Side</span><span class="v">${sideLabel}</span></div>`,
    `<div class="spec-row"><span class="k">Role</span><span class="v">Student</span></div>`,
    `<div class="spec-row"><span class="k">Sensei</span><span class="${senseiName==='—'?'v dimv':'v'}">${senseiName}</span></div>`,
    `<div class="spec-row"><span class="k">Outcome</span>${outcomeV}</div>`,
  ];

  // ----- collapsed extra: full Identity / Arena / Match (all real fields) -----
  const arena = (dash && dash.arena) || {};
  const zone = m.zone || null;
  const rows = [];

  rows.push(section("Identity"));
  rows.push(row("Policy", m[slot + "_policy"] ? prettyPolicy(m[slot + "_policy"]) : undefined));
  if (dash) {
    if (trained) {
      rows.push(row("Curriculum", dash.trained_curriculum_id));
      rows.push(row("Policy seed", dash.trained_policy_seed));
    } else if (isBase) {
      rows.push(row("Curriculum", dash.base_curriculum_id));
      rows.push(row("Policy seed", dash.base_policy_seed));
    } else {
      rows.push(row("Curriculum", undefined));
    }
  } else {
    rows.push(row("Curriculum", undefined));
    rows.push(row("Policy seed", undefined));
  }

  rows.push(section("Arena"));
  rows.push(row("Game", fam));
  rows.push(row("Config", m.config));
  const plat = replay.platform || {};
  const widthFromPlat = (plat.x_right != null && plat.x_left != null)
    ? +(plat.x_right - plat.x_left).toFixed(2) : undefined;
  rows.push(row("Platform width", arena.platform_width != null ? arena.platform_width : widthFromPlat));
  rows.push(row("Gravity", arena.gravity));
  rows.push(row("Knockback", arena.knockback));
  rows.push(row("Spawn gap", arena.spawn_gap));
  rows.push(row("Difficulty", arena.difficulty != null ? arena.difficulty : undefined));
  if (zone) {
    rows.push(row("Hill center", zone.center));
    rows.push(row("Hill half-width", zone.half));
  }

  rows.push(section("Match"));
  rows.push(row("Match seed", (dash && dash.match_seed != null) ? dash.match_seed : m.seed));
  rows.push(row("Frames", (m.frames != null) ? m.frames : (replay.frames ? replay.frames.length : undefined)));
  if (Array.isArray(m.zone_time_final)) {
    const zt = m.zone_time_final[slot === "p1" ? 0 : 1];
    rows.push(row("Zone time", zt));
  }

  const wasOpen = $(side + "_rows").querySelector(".spec-extra.open") != null;
  $(side + "_rows").innerHTML =
    top.join("") +
    `<div class="spec-extra${wasOpen ? " open" : ""}">` + rows.join("") + `</div>`;
}

// ---- chibi portrait, drawn into the round avatar canvas (matches the fighters) ----
function drawAvatar(canvasId, color, isTrainedSide) {
  const c = $(canvasId);
  if (!c) return;
  const x = c.getContext("2d");
  const W = c.width, H = c.height;
  x.clearRect(0, 0, W, H);
  const cx = W / 2;
  const robe = "#f3ecda", robeLine = "#b9ad8d", skin = "#f0cda0", hair = "#2a1d14", ink = "#33281d";
  x.lineJoin = "round"; x.lineCap = "round";

  // little gi shoulders rising from the bottom
  x.fillStyle = robe; x.strokeStyle = ink; x.lineWidth = 1.6;
  x.beginPath();
  x.moveTo(cx - 26, H + 4);
  x.quadraticCurveTo(cx - 24, 52, cx - 14, 50);
  x.lineTo(cx + 14, 50);
  x.quadraticCurveTo(cx + 24, 52, cx + 26, H + 4);
  x.closePath(); x.fill(); x.stroke();
  // crossed lapel V
  x.strokeStyle = robeLine; x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx - 11, 52); x.lineTo(cx, 66); x.lineTo(cx + 11, 52); x.stroke();
  // belt (team color)
  x.fillStyle = color; x.fillRect(cx - 26, 66, 52, 6);
  x.fillStyle = shade(color, -26); x.fillRect(cx - 26, 70.5, 52, 1.6);
  x.fillStyle = shade(color, -14); x.fillRect(cx - 3, 65, 6, 8);

  // BIG chibi head
  const hr = 21, hy = 30;
  x.fillStyle = skin; x.strokeStyle = ink; x.lineWidth = 1.7;
  x.beginPath(); x.ellipse(cx, hy, hr, hr * 1.02, 0, 0, Math.PI * 2); x.fill(); x.stroke();
  // hair cap
  x.fillStyle = hair;
  x.beginPath();
  x.moveTo(cx - hr * 0.98, hy - hr * 0.16);
  x.quadraticCurveTo(cx - hr * 1.06, hy - hr * 1.05, cx, hy - hr * 1.12);
  x.quadraticCurveTo(cx + hr * 1.06, hy - hr * 1.05, cx + hr * 0.98, hy - hr * 0.16);
  x.quadraticCurveTo(cx + hr * 0.4, hy - hr * 0.42, cx, hy - hr * 0.30);
  x.quadraticCurveTo(cx - hr * 0.4, hy - hr * 0.42, cx - hr * 0.98, hy - hr * 0.16);
  x.closePath(); x.fill();
  // headband (team color)
  x.save();
  x.beginPath(); x.ellipse(cx, hy, hr, hr * 1.02, 0, 0, Math.PI * 2); x.clip();
  x.fillStyle = color; x.fillRect(cx - hr - 2, hy - hr * 0.34, hr * 2 + 4, hr * 0.32);
  x.fillStyle = shade(color, -26); x.fillRect(cx - hr - 2, hy - hr * 0.05, hr * 2 + 4, hr * 0.06);
  x.restore();
  // knot tails (left side)
  x.fillStyle = color;
  x.beginPath(); x.moveTo(cx - hr * 0.9, hy - hr * 0.2);
  x.quadraticCurveTo(cx - hr * 1.5, hy - hr * 0.1, cx - hr * 1.7, hy + hr * 0.1);
  x.lineTo(cx - hr * 1.4, hy + hr * 0.15);
  x.quadraticCurveTo(cx - hr * 1.1, hy + hr * 0.05, cx - hr * 0.85, hy); x.closePath(); x.fill();
  // determined brows
  x.strokeStyle = "#3a2a1c"; x.lineWidth = 2.4;
  x.beginPath(); x.moveTo(cx - hr * 0.55, hy - hr * 0.12); x.lineTo(cx - hr * 0.18, hy + hr * 0.02); x.stroke();
  x.beginPath(); x.moveTo(cx + hr * 0.55, hy - hr * 0.12); x.lineTo(cx + hr * 0.18, hy + hr * 0.02); x.stroke();
  // big eyes
  for (const s of [-1, 1]) {
    const ex = cx + s * hr * 0.34;
    x.fillStyle = "#fbf6ec"; x.strokeStyle = "#33281d"; x.lineWidth = 1.2;
    x.beginPath(); x.ellipse(ex, hy + hr * 0.18, hr * 0.20, hr * 0.27, 0, 0, Math.PI * 2); x.fill(); x.stroke();
    x.fillStyle = "#241a12";
    x.beginPath(); x.arc(ex, hy + hr * 0.20, hr * 0.12, 0, Math.PI * 2); x.fill();
    x.fillStyle = "rgba(255,255,255,0.95)";
    x.beginPath(); x.arc(ex - 1.4, hy + hr * 0.14, hr * 0.045, 0, Math.PI * 2); x.fill();
  }
  // tiny smile + blush
  x.strokeStyle = "#7a4a36"; x.lineWidth = 1.8;
  x.beginPath(); x.arc(cx, hy + hr * 0.5, hr * 0.16, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke();
  x.fillStyle = "rgba(224,120,90,0.16)";
  x.beginPath(); x.arc(cx - hr * 0.5, hy + hr * 0.46, hr * 0.14, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(cx + hr * 0.5, hy + hr * 0.46, hr * 0.14, 0, Math.PI * 2); x.fill();
}

function getCSS(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";
}

// ===================================================================== geometry
function worldToScreen(plat) {
  const padX = 96, padBottom = 96, padTop = 70;
  const W = canvas.width, H = canvas.height;
  const span = (plat.x_right - plat.x_left) || 1;
  const sx = (x) => padX + ((x - plat.x_left) / span) * (W - 2 * padX);
  const groundY = H - padBottom;
  const sy = (y) => groundY - y * ((groundY - padTop) / 5.0);
  return { sx, sy, groundY, padX, W, H, span };
}

// ===================================================================== DOJO background
// Procedurally drawn so it ships with no external assets, but uses
// assets/dojo.png if that image is present.
function drawDojo(W, H, groundY) {
  if (dojoImgReady && dojoImg) {
    // cover-fit the supplied art
    const ir = dojoImg.width / dojoImg.height, cr = W / H;
    let dw, dh;
    if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
    ctx.drawImage(dojoImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    // gentle vignette so fighters/tags stay readable
    const vg = ctx.createRadialGradient(W/2, H*0.42, H*0.2, W/2, H*0.5, H*0.95);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.42)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    return;
  }

  // ---- back wall: warm interior gradient ----
  const wall = ctx.createLinearGradient(0, 0, 0, groundY);
  wall.addColorStop(0, "#3a2a18");
  wall.addColorStop(0.55, "#2c1f12");
  wall.addColorStop(1, "#24190e");
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, W, groundY + 6);

  // ---- weathered washi-panel wall: aged paper, real texture, warm light ----
  const shojiTop = 18, shojiBot = groundY - 8, shojiL = 40, shojiR = W - 40;
  const panelW = (shojiR - shojiL);
  const wallH  = shojiBot - shojiTop;
  // base aged paper — warmer & a touch deeper than before
  const paper = ctx.createLinearGradient(0, shojiTop, 0, shojiBot);
  paper.addColorStop(0,   "#e0cfa4");
  paper.addColorStop(0.45,"#cdb88a");
  paper.addColorStop(1,   "#a78f64");
  ctx.fillStyle = paper;
  roundRect(shojiL, shojiTop, panelW, wallH, 4); ctx.fill();

  // clip to the wall for texture passes
  ctx.save();
  roundRect(shojiL, shojiTop, panelW, wallH, 4); ctx.clip();

  // (a) warm directional light from the upper-left (lanterns + offscreen window)
  const lite = ctx.createRadialGradient(shojiL + panelW*0.32, shojiTop + 30, 40,
                                        shojiL + panelW*0.40, shojiTop + 80, panelW*0.7);
  lite.addColorStop(0, "rgba(255,244,212,0.42)");
  lite.addColorStop(0.5, "rgba(255,232,180,0.12)");
  lite.addColorStop(1, "rgba(120,80,40,0)");
  ctx.fillStyle = lite; ctx.fillRect(shojiL, shojiTop, panelW, wallH);
  // cooler falloff into the lower-right corner (depth)
  const shadeCorner = ctx.createLinearGradient(shojiR, shojiBot, shojiL + panelW*0.4, shojiTop + wallH*0.4);
  shadeCorner.addColorStop(0, "rgba(30,18,10,0.42)");
  shadeCorner.addColorStop(1, "rgba(30,18,10,0)");
  ctx.fillStyle = shadeCorner; ctx.fillRect(shojiL, shojiTop, panelW, wallH);

  // (b) painterly grunge: organic stains + a value-noise field (hashed, stable)
  const seed = 1337;
  const rnd = mulberry32(seed);
  // soft blotchy water-stains
  for (let i = 0; i < 26; i++) {
    const bx = shojiL + rnd() * panelW;
    const by = shojiTop + rnd() * wallH;
    const br = 18 + rnd() * 60;
    const dark = rnd() > 0.5;
    const g = ctx.createRadialGradient(bx, by, 1, bx, by, br);
    const a = 0.05 + rnd() * 0.07;
    if (dark) { g.addColorStop(0, `rgba(70,48,24,${a})`); g.addColorStop(1, "rgba(70,48,24,0)"); }
    else      { g.addColorStop(0, `rgba(255,238,200,${a*0.9})`); g.addColorStop(1, "rgba(255,238,200,0)"); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
  }
  // fine speckle / fibre grain
  ctx.globalAlpha = 1;
  for (let i = 0; i < 900; i++) {
    const px = shojiL + rnd() * panelW;
    const py = shojiTop + rnd() * wallH;
    const v = rnd();
    ctx.fillStyle = v > 0.5 ? `rgba(60,42,22,${0.04 + rnd()*0.06})`
                            : `rgba(255,240,205,${0.03 + rnd()*0.05})`;
    ctx.fillRect(px, py, 1.2, 1.2);
  }
  // a couple of long vertical paper-seam creases
  ctx.strokeStyle = "rgba(70,48,26,0.10)"; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const cx0 = shojiL + (0.5 + i) / 5 * panelW + (rnd() - 0.5) * 20;
    ctx.beginPath(); ctx.moveTo(cx0, shojiTop); ctx.lineTo(cx0 + (rnd()-0.5)*8, shojiBot); ctx.stroke();
  }
  ctx.restore();

  // ---- dark wooden lattice (kumiko) — beveled, with worn highlights ----
  const cols = 6, rows = 4;
  const drawLat = (x1, y1, x2, y2) => {
    ctx.strokeStyle = "rgba(38,24,12,0.88)"; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = "rgba(120,84,44,0.30)"; ctx.lineWidth = 1;          // worn top-light
    ctx.beginPath(); ctx.moveTo(x1 - 1, y1 - 1); ctx.lineTo(x2 - 1, y2 - 1); ctx.stroke();
  };
  for (let c = 0; c <= cols; c++) {
    const x = shojiL + panelW * (c / cols);
    drawLat(x, shojiTop, x, shojiBot);
  }
  for (let r = 0; r <= rows; r++) {
    const y = shojiTop + wallH * (r / rows);
    drawLat(shojiL, y, shojiR, y);
  }
  // outer frame: dark lacquered wood with inner bevel
  ctx.strokeStyle = "#1d1208"; ctx.lineWidth = 7;
  roundRect(shojiL, shojiTop, panelW, wallH, 4); ctx.stroke();
  ctx.strokeStyle = "rgba(140,96,50,0.25)"; ctx.lineWidth = 1.5;
  roundRect(shojiL + 3, shojiTop + 3, panelW - 6, wallH - 6, 3); ctx.stroke();

  // ---- hanging cloth banners (左 道場 / 右 空手) ----
  drawBanner(W * 0.16, shojiTop - 4, 56, 150, "道場", "#7a1f17");
  drawBanner(W * 0.84, shojiTop - 4, 56, 150, "空手", "#3a4a2a");

  // ---- paper lanterns ----
  drawLantern(W * 0.30, shojiTop + 8, 22);
  drawLantern(W * 0.70, shojiTop + 8, 22);

  // ---- katana mounted on the back wall (alcove), high & clear of fighters ----
  drawKatana(W * 0.50, shojiTop + (shojiBot - shojiTop) * 0.30, 160);

  // ---- wooden floor: planks + reflections ----
  drawFloor(W, H, groundY);

  // ---- "personal touch" set-dressing: bonsai L, stone lantern R, leaves ----
  drawBonsai(shojiL + 24, groundY + 4, 0.95);
  drawStoneLantern(shojiR - 30, groundY - 2, 0.95);
  drawLeaves(W, groundY);

  // ---- ambient overhead light / vignette ----
  const amb = ctx.createRadialGradient(W/2, groundY - 40, 40, W/2, groundY - 20, W * 0.8);
  amb.addColorStop(0, "rgba(255,225,170,0.10)");
  amb.addColorStop(1, "rgba(0,0,0,0.30)");
  ctx.fillStyle = amb;
  ctx.fillRect(0, 0, W, H);

  // gentle painterly grade over the whole stage (warm highs, cool-deep lows)
  const grade = ctx.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, "rgba(255,210,140,0.05)");
  grade.addColorStop(0.6, "rgba(0,0,0,0)");
  grade.addColorStop(1, "rgba(10,6,3,0.22)");
  ctx.fillStyle = grade; ctx.fillRect(0, 0, W, H);
}

// ---- bonsai in a glazed pot (lower-left) ----
function drawBonsai(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  // soft cast shadow
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, Math.PI*2); ctx.fill();
  // glazed pot (warm brown, trapezoid, lip)
  const potGrad = ctx.createLinearGradient(0, -14, 0, 2);
  potGrad.addColorStop(0, "#6b4326"); potGrad.addColorStop(1, "#3e2614");
  ctx.fillStyle = potGrad; ctx.strokeStyle = "#241408"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-22, -14); ctx.lineTo(22, -14); ctx.lineTo(17, 0); ctx.lineTo(-17, 0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#7a4e2c";
  roundRect(-25, -18, 50, 5, 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,210,150,0.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-23, -16); ctx.lineTo(23, -16); ctx.stroke();
  // moss/soil
  ctx.fillStyle = "#2f3a1c";
  ctx.beginPath(); ctx.ellipse(0, -16, 17, 3.5, 0, 0, Math.PI*2); ctx.fill();
  // gnarled trunk
  ctx.strokeStyle = "#4a3017"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(2, -16); ctx.quadraticCurveTo(-6, -30, 0, -40);
  ctx.quadraticCurveTo(6, -50, -2, -58); ctx.stroke();
  ctx.strokeStyle = "#5c3c1d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-1, -42); ctx.quadraticCurveTo(10, -46, 16, -54); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -50); ctx.quadraticCurveTo(-12, -54, -16, -62); ctx.stroke();
  // foliage clouds (layered greens with warm rim)
  const blobs = [[-16,-64,15],[2,-70,18],[18,-60,14],[-4,-58,12],[10,-72,11]];
  for (const [bx, by, br] of blobs) {
    const g = ctx.createRadialGradient(bx - br*0.3, by - br*0.4, 1, bx, by, br);
    g.addColorStop(0, "#5c7a34"); g.addColorStop(0.7, "#3f5a23"); g.addColorStop(1, "#2c4019");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
  }
  // warm rim-light on the canopy (matches upper-left key light)
  ctx.fillStyle = "rgba(220,210,120,0.18)";
  ctx.beginPath(); ctx.arc(-12, -70, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -76, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---- stone lantern (ishidoro) with a warm glow (lower-right) ----
function drawStoneLantern(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.beginPath(); ctx.ellipse(0, 2, 24, 5, 0, 0, Math.PI*2); ctx.fill();
  const stone = "#5a564e", stoneLt = "#74706857", stoneShade = "#3b3832";
  const block = (bx, by, bw, bh, r) => {
    const g = ctx.createLinearGradient(bx - bw/2, 0, bx + bw/2, 0);
    g.addColorStop(0, stone); g.addColorStop(0.5, "#6a665d"); g.addColorStop(1, stoneShade);
    ctx.fillStyle = g; ctx.strokeStyle = "#2c2925"; ctx.lineWidth = 1;
    roundRect(bx - bw/2, by - bh, bw, bh, r||2); ctx.fill(); ctx.stroke();
  };
  // base + post + platform
  block(0, 0, 30, 8, 3);
  block(0, -8, 8, 26, 2);
  block(0, -34, 26, 8, 3);
  // light chamber (fire box) with warm glow
  const glow = ctx.createRadialGradient(0, -48, 1, 0, -48, 18);
  glow.addColorStop(0, "rgba(255,196,110,0.95)");
  glow.addColorStop(0.6, "rgba(240,150,60,0.5)");
  glow.addColorStop(1, "rgba(240,150,60,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, -48, 18, 0, Math.PI*2); ctx.fill();
  // chamber walls (with a glowing window)
  ctx.fillStyle = "#4f4b43"; ctx.strokeStyle = "#2c2925"; ctx.lineWidth = 1;
  roundRect(-11, -58, 22, 22, 2); ctx.fill(); ctx.stroke();
  const win = ctx.createRadialGradient(0, -47, 1, 0, -47, 9);
  win.addColorStop(0, "#fff0c8"); win.addColorStop(0.6, "#ffbe66"); win.addColorStop(1, "#b9742a");
  ctx.fillStyle = win; ctx.fillRect(-7, -54, 14, 14);
  ctx.strokeStyle = "#2c2925"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, -54); ctx.lineTo(0, -40); ctx.moveTo(-7, -47); ctx.lineTo(7, -47); ctx.stroke();
  // umbrella roof (kasa) + finial
  ctx.fillStyle = "#605b51"; ctx.strokeStyle = "#2c2925"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-16, -58); ctx.lineTo(16, -58); ctx.lineTo(11, -70); ctx.lineTo(-11, -70); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#6a665d";
  ctx.beginPath(); ctx.arc(0, -73, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---- a few scattered autumn leaves on the floor (stable scatter) ----
function drawLeaves(W, groundY) {
  const rnd = mulberry32(7);
  const cols = ["#b4521f", "#c87a2a", "#9a3d18", "#caa23a"];
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const lx = 80 + rnd() * (W - 160);
    const ly = groundY + 14 + rnd() * 60;
    const rot = rnd() * Math.PI * 2;
    const sc = 0.7 + rnd() * 0.7;
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(rot); ctx.scale(sc, sc * 0.78);
    ctx.fillStyle = cols[(rnd() * cols.length) | 0];
    // simple maple-ish leaf: three lobes
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.quadraticCurveTo(-6, 2, -5, -5);
    ctx.quadraticCurveTo(-1, -3, 0, -8);
    ctx.quadraticCurveTo(1, -3, 5, -5);
    ctx.quadraticCurveTo(6, 2, 0, 6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(60,30,10,0.4)"; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -7); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawFloor(W, H, groundY) {
  // base wood
  const floor = ctx.createLinearGradient(0, groundY, 0, H);
  floor.addColorStop(0, "#6b4523");
  floor.addColorStop(0.25, "#5a3a1d");
  floor.addColorStop(1, "#3c2614");
  ctx.fillStyle = floor;
  ctx.fillRect(0, groundY, W, H - groundY);

  // perspective plank seams: vanishing toward a high vanishing point
  const vpX = W / 2, vpY = groundY - (H - groundY) * 2.4;
  ctx.strokeStyle = "rgba(30,18,9,0.55)";
  ctx.lineWidth = 1.5;
  const planks = 9;
  for (let i = 0; i <= planks; i++) {
    const fx = (i / planks) * W;
    ctx.beginPath();
    ctx.moveTo(fx, H);
    // converge slightly toward the vanishing x
    const tx = fx + (vpX - fx) * 0.18;
    ctx.lineTo(tx, groundY);
    ctx.stroke();
  }
  // horizontal board breaks with subtle highlight
  for (let r = 1; r <= 4; r++) {
    const t = r / 5;
    const y = groundY + (H - groundY) * t * t; // denser near front
    ctx.strokeStyle = "rgba(20,12,6,0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.strokeStyle = "rgba(255,210,150,0.06)";
    ctx.beginPath(); ctx.moveTo(0, y + 1.5); ctx.lineTo(W, y + 1.5); ctx.stroke();
  }
  // glossy reflection band near the front edge
  const gloss = ctx.createLinearGradient(0, groundY, 0, groundY + 46);
  gloss.addColorStop(0, "rgba(255,236,200,0.16)");
  gloss.addColorStop(1, "rgba(255,236,200,0)");
  ctx.fillStyle = gloss;
  ctx.fillRect(0, groundY, W, 46);
}

function drawBanner(cx, top, w, h, text, col) {
  ctx.save();
  // cord
  ctx.strokeStyle = "#1d1208"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, top - 8); ctx.lineTo(cx, top); ctx.stroke();
  // cloth with slight bottom sway (notched bottom)
  const x = cx - w/2;
  const grad = ctx.createLinearGradient(x, top, x + w, top);
  grad.addColorStop(0, shade(col, -18));
  grad.addColorStop(0.5, col);
  grad.addColorStop(1, shade(col, -28));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x + w, top);
  ctx.lineTo(x + w, top + h);
  ctx.lineTo(cx + 6, top + h - 12);
  ctx.lineTo(cx, top + h);
  ctx.lineTo(cx - 6, top + h - 12);
  ctx.lineTo(x, top + h);
  ctx.closePath();
  ctx.fill();
  // border
  ctx.strokeStyle = shade(col, -40); ctx.lineWidth = 2; ctx.stroke();
  // kanji (vertical)
  ctx.fillStyle = "#f2e6cf";
  ctx.font = "700 26px ui-sans-serif, system-ui";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 3;
  for (let i = 0; i < text.length; i++) {
    ctx.fillText(text[i], cx, top + 34 + i * 34);
  }
  ctx.restore();
}

function drawLantern(cx, top, r) {
  ctx.save();
  // cord
  ctx.strokeStyle = "#1d1208"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, top - 12); ctx.lineTo(cx, top); ctx.stroke();
  // glowing body
  const g = ctx.createRadialGradient(cx, top + r, r*0.2, cx, top + r, r*1.4);
  g.addColorStop(0, "#ffe7b0");
  g.addColorStop(0.7, "#e8a23c");
  g.addColorStop(1, "#9a5a1e");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, top + r, r, r * 1.25, 0, 0, Math.PI * 2);
  ctx.fill();
  // ribs
  ctx.strokeStyle = "rgba(120,60,20,0.5)"; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, top + r, Math.abs(i) * (r/3) + 2, r * 1.25, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // caps
  ctx.fillStyle = "#1d1208";
  ctx.fillRect(cx - r*0.4, top - 2, r*0.8, 4);
  ctx.fillRect(cx - r*0.4, top + r*2.3, r*0.8, 4);
  // light bloom
  const bloom = ctx.createRadialGradient(cx, top + r, 2, cx, top + r, r*3);
  bloom.addColorStop(0, "rgba(255,210,130,0.30)");
  bloom.addColorStop(1, "rgba(255,210,130,0)");
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(cx, top + r, r*3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawKatana(cx, y, w) {
  ctx.save();
  // small alcove backing (a darker recessed panel — tokonoma feel)
  ctx.fillStyle = "rgba(40,26,14,0.45)";
  roundRect(cx - w/2 - 26, y - 30, w + 52, 64, 6); ctx.fill();
  ctx.strokeStyle = "rgba(20,12,6,0.6)"; ctx.lineWidth = 2;
  roundRect(cx - w/2 - 26, y - 30, w + 52, 64, 6); ctx.stroke();
  // two-peg dark wood wall rack
  ctx.lineCap = "round";
  ctx.strokeStyle = "#2a1a0d"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx - w/2 - 14, y + 18); ctx.lineTo(cx - w/2 - 14, y - 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w/2 + 14, y + 18); ctx.lineTo(cx + w/2 + 14, y - 8); ctx.stroke();
  // peg tips
  ctx.fillStyle = "#3a2614";
  ctx.beginPath(); ctx.arc(cx - w/2 - 14, y - 8, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + w/2 + 14, y - 8, 4, 0, Math.PI*2); ctx.fill();
  // saya (sheath) — lacquer black with a faint highlight, gentle curve
  ctx.strokeStyle = "#0c0a08"; ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(cx - w/2, y + 4);
  ctx.quadraticCurveTo(cx, y - 9, cx + w/2, y + 4);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - w/2 + 6, y + 2);
  ctx.quadraticCurveTo(cx, y - 11, cx + w/2 - 6, y + 2);
  ctx.stroke();
  // tsuka (handle wrap) + tsuba (guard) + gold menuki
  ctx.strokeStyle = "#6b4a22"; ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(cx + w/2 - 34, y);
  ctx.lineTo(cx + w/2, y + 4);
  ctx.stroke();
  ctx.fillStyle = "#1d1208";
  ctx.fillRect(cx + w/2 - 36, y - 6, 4, 12);   // tsuba
  ctx.fillStyle = "#c8972e";
  ctx.beginPath(); ctx.arc(cx + w/2 - 22, y + 1, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===================================================================== render orchestration
function requestRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame((ts) => { rafPending = false; render(ts); });
}

function render(ts) {
  if (!replay) return;
  const now = ts || performance.now();
  const dt = Math.min(0.05, (now - lastRenderTs) / 1000 || 0.016);
  lastRenderTs = now;

  frame = Math.max(0, Math.min(frame, replay.frames.length - 1));
  const fr = replay.frames[frame];
  const plat = replay.platform || { x_left: 0, x_right: 10, y: 0 };
  const geo = worldToScreen(plat);
  const { sx, sy, groundY, padX, W, H } = geo;
  const m = replay.meta || {};

  ctx.clearRect(0, 0, W, H);

  // advance the FX clock (decays shake, ages particles) once per repaint.
  if (fx) fx.tick(now);

  // team identity / per-frame contact flags (needed before the scene draw so
  // FX can be triggered as the world is painted).
  const ts2 = trainedSlot(m);
  const p1Trained = ts2 === "p1";
  const p2Trained = ts2 === "p2";
  const p1Color = ts2 ? (p1Trained ? getCSS("--trained") : getCSS("--base")) : getCSS("--trained");
  const p2Color = ts2 ? (p2Trained ? getCSS("--trained") : getCSS("--base")) : getCSS("--base");
  const evs = fr.events || [];
  const p1Hit = evs.includes("p1_punch");
  const p2Hit = evs.includes("p2_punch");
  const p1KO  = evs.includes("p1_ringout") || isOffEdge(fr.p1, plat);
  const p2KO  = evs.includes("p2_ringout") || isOffEdge(fr.p2, plat);
  // team identity per slot: trained side -> red figure, base side -> blue.
  const p1Team = p2Trained ? "base" : "trained";   // p1 is base only when p2 is the trained slot
  const p2Team = p2Trained ? "trained" : "base";

  // fire one-shot FX on the *frame the contact happens*, edge-detected so the
  // continuous repaint loop doesn't re-trigger them every frame.
  maybeFireFX(fr, geo, plat, p1Hit, p2Hit, p1KO, p2KO, p1Color, p2Color, m);

  // ---- WORLD (shaken) : everything that should react to camera shake ----
  ctx.save();
  if (fx) fx.applyShake(ctx);

  // DOJO backdrop
  drawDojo(W, H, groundY);
  // platform: a tatami/wood dueling deck on the floor
  drawPlatformDeck(geo, plat);
  // KOTH zone (only when present)
  const zone = m.zone || zoneFromFrame(fr);
  const isKoth = gameKey(m) === "koth" || !!zone;
  if (isKoth && zone) drawZone(geo, plat, zone, fr);

  // draw shadows first so fighters sit on the deck
  drawShadow(fr.p1, geo, plat);
  drawShadow(fr.p2, geo, plat);

  drawFighter(fr.p1, "p1", p1Team, p1Color, geo, plat, now, p1Hit, p1KO);
  drawFighter(fr.p2, "p2", p2Team, p2Color, geo, plat, now, p2Hit, p2KO);

  // game-feel particles (impacts / streaks / dust) live in world space so they
  // shake with the scene; this replaces the old hand-rolled impactBurst.
  if (fx) fx.drawWorld(ctx, now);
  ctx.restore();   // close the shaken transform

  // ---- ATMOSPHERE (screen space) : drifting dust + breathing lantern glow.
  // lanterns/vignette are off — drawDojo already paints those, no doubling.
  if (fx) fx.ambient(ctx, now, { groundY, lanterns: false, vignette: false });

  // ---- floating player tags (eased follow) ----
  drawTag("p1", fr.p1, slotLabel(m, "p1"), p1Color, geo, plat, dt, p1Hit, p1KO);
  drawTag("p2", fr.p2, slotLabel(m, "p2"), p2Color, geo, plat, dt, p2Hit, p2KO);

  // ---- RING-OUT stinger (K.O. / RING OUT! flash) — screen space, on top ----
  if (fx) fx.drawHud(ctx, now);

  // ---- HUD / scrubber ----
  if (timeCur) timeCur.textContent = fmtTime(frame);
  if (timeTot) timeTot.textContent = fmtTime(replay.frames.length - 1);
  scrub.value = frame;
  paintScrub();   // theme hook: fill the played portion of the track

  // No on-stage victory banner by design — the outcome reads quietly in the
  // side panels (Outcome row + a small 勝 mark on the winner). This matches the
  // approved reference and avoids the "really AI" saturated win bar.

  // keep animating (procedural idle/walk cycles, FX particles, tag easing) — the
  // figures + FX animate from wall-clock, so keep a gentle loop alive whenever a
  // replay is shown, or while FX are still settling.
  if (tagsSettling() || playing || replay || (fx && (fx.isShaking() || fx.hasStinger()))) requestRender();
}

// Theme hook #2 — paint the scrubber's played/remaining split via --scrub-pct.
function paintScrub() {
  const max = +scrub.max || 0;
  const pct = max > 0 ? (+scrub.value / max) * 100 : 0;
  scrub.style.setProperty("--scrub-pct", pct + "%");
}

// ===================================================================== FX triggers
// Edge-detected so each contact fires its impact/knockback exactly once, even
// though render() repaints continuously for the idle/walk cycles.
function maybeFireFX(fr, geo, plat, p1Hit, p2Hit, p1KO, p2KO, p1Color, p2Color, m) {
  if (!fx) return;
  const { sx, sy } = geo;
  const fxRgb = (hex) => { const c = hexToRgb(hex); return c ? [c.r, c.g, c.b] : undefined; };

  // ---- punch contact -> impact star + a little shake (once per frame index) ----
  // The latch stores the frame index a slot last fired on; a continuous repaint
  // of the same frame won't re-fire, but advancing to a new punch frame will.
  const handlePunch = (slot, b, hit, color) => {
    const st = fxState[slot];
    if (hit) {
      if (st.lastPunchFrame !== frame) {
        st.lastPunchFrame = frame;
        const dir = (b.facing < 0) ? -1 : 1;
        // land the star at the extended fist: forward of the body, torso height
        fx.spawnImpact(sx(b.x) + dir * 34, sy(b.y) - 96, { facing: dir, color: fxRgb(color) });
      }
    } else {
      st.lastPunchFrame = -1;                    // re-arm once the punch frame passes
    }
  };
  handlePunch("p1", fr.p1, p1Hit, p1Color);
  handlePunch("p2", fr.p2, p2Hit, p2Color);

  // ---- big launch / ring-out edge -> knockback streaks + heavy shake ----
  const fireKO = (slot, b, ko, color) => {
    const st = fxState[slot];
    if (ko && !st.lastKO) {
      const dir = (b.x > (plat.x_left + plat.x_right) / 2) ? 1 : -1;  // launched outward
      fx.knockback(sx(b.x), sy(b.y) - 70, {
        dir, intensity: 16, color: fxRgb(color), groundY: geo.groundY,
      });
    }
    st.lastKO = ko;
  };
  fireKO("p1", fr.p1, p1KO, p1Color);
  fireKO("p2", fr.p2, p2KO, p2Color);

  // ---- ring-out / final-frame -> the K.O. stinger, fired once ----
  const isLast = frame === (replay.frames.length - 1);
  const anyKO = p1KO || p2KO;
  if ((anyKO || isLast) && lastRingOutFrame !== frame) {
    // only stinger on a real decisive ending: a KO this frame, or the last frame
    // of a match that actually has a winner (skip pure draws to avoid a false KO).
    const winnerSlot = p1KO ? "p2" : p2KO ? "p1" : decisiveWinnerSlot(m);
    if (anyKO || winnerSlot) {
      const label = winnerSlot ? slotLabel(m, winnerSlot) : null;
      const wColor = winnerSlot === "p1" ? p1Color : winnerSlot === "p2" ? p2Color : p1Color;
      fx.ringOut(label, { color: fxRgb(wColor) });
      lastRingOutFrame = frame;
    }
  }
  if (!anyKO && !isLast) lastRingOutFrame = -1;   // re-arm when scrubbing back
}

// Which slot won, if the match has a decisive (non-draw) outcome — else null.
function decisiveWinnerSlot(m) {
  if (slotOutcome(m, "p1") === "win") return "p1";
  if (slotOutcome(m, "p2") === "win") return "p2";
  return null;
}

function tagsSettling() {
  return false; // tags converge fast; re-render is driven by frame changes & play loop
}

// ===================================================================== outcome (no banner)
// The loud on-stage victory plaque was removed by design. The result now reads
// quietly in the side panels (Outcome row + a small 勝 mark on the winner), per
// the approved reference. These remain as harmless no-ops so any legacy callers
// don't throw — and #banner stays empty/hidden.
function showVerdict() { /* intentionally no-op — outcome lives in the side panels */ }
function hideVerdict() { if (banner && banner.innerHTML) banner.innerHTML = ""; }

// ===================================================================== platform deck
function drawPlatformDeck(geo, plat) {
  const { sx, groundY, H, W } = geo;
  const platL = sx(plat.x_left), platR = sx(plat.x_right);
  const span = platR - platL;
  // soft contact shadow the plinth casts on the floor
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.beginPath(); ctx.ellipse((platL+platR)/2, groundY + 16, span/2 + 14, 9, 0, 0, Math.PI*2); ctx.fill();

  // ---- warm worn-wood plinth (a low raised stage) ----
  const deckH = 16;            // visible top thickness
  const faceH = 12;            // front face (depth)
  // front face — warm worn wood (lit from upper-left, in partial shadow)
  const face = ctx.createLinearGradient(0, groundY + deckH, 0, groundY + deckH + faceH);
  face.addColorStop(0, "#6e451f"); face.addColorStop(0.5, "#553418"); face.addColorStop(1, "#3c2511");
  ctx.fillStyle = face;
  roundRect(platL - 4, groundY + deckH - 3, span + 8, faceH + 4, 3); ctx.fill();
  // vertical grain on the face so it reads as wood, not a flat bar
  ctx.strokeStyle = "rgba(30,18,8,0.35)"; ctx.lineWidth = 1;
  for (let i = 1; i < 24; i++) {
    const gx = platL + span * (i / 24);
    ctx.beginPath(); ctx.moveTo(gx, groundY + deckH - 1); ctx.lineTo(gx, groundY + deckH + faceH); ctx.stroke();
  }
  // warm top catch-light along the lit edge of the face
  ctx.strokeStyle = "rgba(255,196,120,0.18)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(platL - 2, groundY + deckH - 2); ctx.lineTo(platR + 2, groundY + deckH - 2); ctx.stroke();
  // top surface — warm worn planks
  const top = ctx.createLinearGradient(0, groundY, 0, groundY + deckH);
  top.addColorStop(0, "#9a6a38"); top.addColorStop(0.5, "#7d5028"); top.addColorStop(1, "#5e3a1c");
  ctx.fillStyle = top;
  roundRect(platL - 4, groundY - 1, span + 8, deckH + 2, 3); ctx.fill();
  // plank seams across the top
  ctx.strokeStyle = "rgba(40,24,10,0.5)"; ctx.lineWidth = 1;
  const seams = 7;
  for (let i = 1; i < seams; i++) {
    const x = platL + span * (i / seams);
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x - 2, groundY + deckH); ctx.stroke();
  }
  // grain highlights + a warm top edge catch-light (key light from upper-left)
  ctx.strokeStyle = "rgba(255,214,150,0.22)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(platL - 2, groundY + 0.5); ctx.lineTo(platR + 2, groundY + 0.5); ctx.stroke();
  ctx.strokeStyle = "rgba(255,196,120,0.10)"; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const yy = groundY + 3 + i * 3;
    ctx.beginPath(); ctx.moveTo(platL, yy); ctx.lineTo(platL + span * (0.4 + i*0.12), yy); ctx.stroke();
  }
  // lacquer-capped ring-out edges (the only team-neutral accent — restrained)
  ctx.fillStyle = "#5a1f17";
  roundRect(platL - 6, groundY - 2, 5, deckH + faceH + 2, 2); ctx.fill();
  roundRect(platR + 1, groundY - 2, 5, deckH + faceH + 2, 2); ctx.fill();
  ctx.fillStyle = "rgba(196,69,60,0.7)";
  ctx.fillRect(platL - 6, groundY - 2, 5, 3);
  ctx.fillRect(platR + 1, groundY - 2, 5, 3);
}

// ===================================================================== KOTH zone
function zoneFromFrame(fr) {
  // some traces could carry zone bounds per-frame; meta is the source of truth here
  return null;
}
function drawZone(geo, plat, zone, fr) {
  const { sx, groundY } = geo;
  const center = zone.center != null ? zone.center : (plat.x_left + plat.x_right) / 2;
  const half = zone.half != null ? zone.half
             : (zone.hi != null && zone.lo != null) ? (zone.hi - zone.lo) / 2 : 1.0;
  const lo = zone.lo != null ? zone.lo : center - half;
  const hi = zone.hi != null ? zone.hi : center + half;
  const xl = sx(lo), xr = sx(hi), xc = sx(center);

  ctx.save();
  // contested glow on the deck — the hill
  const anyone = fr && (fr.p1_in_zone || fr.p2_in_zone);
  const glow = ctx.createLinearGradient(0, groundY - 64, 0, groundY + 14);
  const gc = anyone ? "200,151,46" : "150,120,70";
  glow.addColorStop(0, `rgba(${gc},0)`);
  glow.addColorStop(1, `rgba(${gc},${anyone ? 0.35 : 0.18})`);
  ctx.fillStyle = glow;
  ctx.fillRect(xl, groundY - 64, xr - xl, 78);

  // hill markers — paper boundary posts with rope
  ctx.strokeStyle = "rgba(232,210,160,0.85)";
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xl, groundY - 60); ctx.lineTo(xl, groundY + 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xr, groundY - 60); ctx.lineTo(xr, groundY + 12); ctx.stroke();
  ctx.setLineDash([]);
  // posts
  ctx.fillStyle = "#7a1f17";
  ctx.fillRect(xl - 3, groundY - 60, 6, 16);
  ctx.fillRect(xr - 3, groundY - 60, 6, 16);

  // center line + 'HILL' label
  ctx.strokeStyle = "rgba(200,151,46,0.6)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xc, groundY - 58); ctx.lineTo(xc, groundY + 12); ctx.stroke();
  ctx.fillStyle = "rgba(232,210,160,0.9)";
  ctx.font = "700 11px ui-sans-serif, system-ui";
  ctx.textAlign = "center";
  ctx.fillText("CONTROL ZONE", xc, groundY - 66);

  // who-holds-it indicator
  if (fr) {
    const holder = fr.p1_in_zone && !fr.p2_in_zone ? "p1"
                 : fr.p2_in_zone && !fr.p1_in_zone ? "p2" : null;
    if (holder) {
      const m = replay.meta || {};
      const tcolor = trainedSlot(m) === holder ? getCSS("--trained") : getCSS("--base");
      ctx.fillStyle = tcolor;
      ctx.beginPath(); ctx.arc(xc, groundY - 78, 5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

// ===================================================================== fighter helpers
function isOffEdge(b, plat) { return b.x < plat.x_left || b.x > plat.x_right; }

function drawShadow(b, geo, plat) {
  const { sx, sy, groundY } = geo;
  if (isOffEdge(b, plat)) return;
  const cx = sx(b.x);
  const yOff = (b.y || 0);
  const r = 24 - Math.min(11, yOff * 4);     // slightly wider for the chibi footprint
  ctx.save();
  ctx.globalAlpha = Math.max(0.12, 0.34 - yOff * 0.06);
  // soft feathered contact shadow
  const sg = ctx.createRadialGradient(cx, groundY + 1, 1, cx, groundY + 1, r);
  sg.addColorStop(0, "rgba(0,0,0,0.55)");
  sg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(cx, groundY + 2, r, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ===================================================================== sprite fighter
// Real-art fighter: slices the correct frame out of a LuizMelo sprite sheet and
// draws it positioned from the replay frame's world x/y, flipped by `facing`,
// tinted to the team color. Advances the animation frame from the replay
// timeline (so scrubbing/stepping shows a consistent pose) plus a little wall-
// clock motion for idle/run liveliness. Falls back to the procedural drawGi if
// the sheets haven't loaded (keeps file:// + first-paint from going blank).
function drawFighter(b, slot, team, color, geo, plat, now, hit, ko) {
  const { sx, sy, groundY } = geo;
  const off = isOffEdge(b, plat) || ko;

  // procedural karate figure (white gi, team headband/belt). Falls back to the
  // inline chibi only while the ES module is still loading (first paint).
  const anim = getAnimator(slot, team);
  if (!anim) { drawGi(b, color, geo, plat, now, hit, ko); return; }

  // map the replay frame -> animation state + facing. Feed the previous frame so
  // the engine can read knockback/fall, and explicit hit/ko so contact reads.
  const prev = (replay && frame > 0) ? replay.frames[frame - 1][slot] : null;
  const st = window.SpriteAnim.selectAction(b, prev, {
    groundY: (plat.y != null ? plat.y : 0),
    gotHit: !!hit && !(b.action === "punch"),   // attacker isn't the one recoiling
    ko: !!off,
  });

  // feet land on the deck surface; on KO they sink into the void below the edge.
  const feetX = sx(b.x);
  let feetY = off
    ? Math.min(groundY + 150, sy(b.y) + (now % 1000) / 1000 * 80)
    : sy(b.y);

  // 150px-tall figure reads at parity with the old sprites without crowding.
  const scale = 1.0;
  ctx.save();
  if (off) ctx.globalAlpha = 0.92;
  anim.draw(ctx, st.action, st.facing, feetX, feetY, scale, now);
  ctx.restore();

  // remember the figure's "core" screen position for the tag follow (above head).
  // the procedural rig's head centre sits ~0.88*H above the feet.
  b.__sx = feetX;
  b.__sy = feetY - anim.baseHeight * scale * 0.88;
  b.__lastY = b.y;
}

// The CHIBI gi fighter — a stylized karate kid: big expressive head, small body,
// gi + colored belt + headband. Fully procedural so it animates per-frame
// (idle / move / jump / punch / KO). Clean line + soft shading, warm light.
// Retained as a fallback for first-paint / file:// when sprite sheets are absent.
function drawGi(b, color, geo, plat, now, hit, ko) {
  const { sx, sy, groundY } = geo;
  const off = isOffEdge(b, plat) || ko;
  const dir = (b.facing < 0) ? -1 : 1;
  const action = b.action || "idle";

  // base anchor: feet on deck (or falling into void if KO/off-edge)
  let footX = sx(b.x);
  let footY = off ? Math.min(groundY + 130, groundY + 30 + (now % 1000) / 1000 * 70) : sy(b.y);

  // KO: tip the figure over as it falls
  let koTilt = off ? dir * 0.9 : 0;

  // ---- chibi proportions: head ≈ 40% of total height ----
  const scale = 1.05;
  const headR   = 18 * scale;      // BIG head — the chibi signature
  const bodyH   = 30 * scale;      // short torso
  const bodyW   = 26 * scale;      // body half-handled below
  const legH    = 12 * scale;      // stubby legs

  // idle breathing + a tiny side-to-side weight shift
  const breathe = Math.sin(now / 520) * 1.6;
  const sway    = Math.sin(now / 700) * 1.0;

  // pose params (chibi-scaled)
  let crouch = 0, lean = 0, armSwing = 0, stance = 7 * scale, jumpLift = 0, squash = 1;
  if (action === "punch")            { lean = dir * 4; armSwing = 1; crouch = 2; stance = 11 * scale; }
  else if (action === "left" || action === "right") {
    const moving = (action === "left") ? -1 : 1;
    lean = moving * 3 + sway * 0.4; stance = 10 * scale; armSwing = 0.5 * moving;
  } else if (action === "jump")      { jumpLift = 14; crouch = -3; stance = 5 * scale; squash = 1.06; }
  else                               { crouch = breathe; lean = sway; }

  // body anchor points (hips just above the legs)
  const hipX = footX + lean;
  const hipY = footY - legH - jumpLift + crouch;          // top of legs
  const bodyTopY = hipY - bodyH;                           // shoulders
  const headCX = hipX + dir * 1 + koTilt * 16;
  const headCY = bodyTopY - headR * 0.78 + (off ? koTilt * 22 : 0);

  ctx.save();
  if (off) { ctx.globalAlpha = 0.9; ctx.translate(headCX, headCY); ctx.rotate(koTilt * 0.55); ctx.translate(-headCX, -headCY); }

  const robe      = off ? "#8b7d68" : "#f3ecda";   // gi off-white
  const robeShade = off ? "#675c4b" : "#dcd2b8";   // fold shade
  const robeLine  = off ? "#4f463a" : "#b9ad8d";   // clean outline
  const skin      = off ? "#cdb79a" : "#f0cda0";   // warm skin
  const skinShade = off ? "#b39e83" : "#e0b386";
  const dark      = "#2a2018";
  const hair      = "#2a1d14";
  const ink       = off ? "#4a4036" : "#33281d";   // line color

  const half = bodyW / 2;

  // ===== legs (two short stubby legs in gi pants) =====
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const footY2 = footY;
  for (const s of [-1, 1]) {
    const lx = hipX + s * stance;
    ctx.strokeStyle = robe; ctx.lineWidth = 9 * scale;
    ctx.beginPath(); ctx.moveTo(hipX + s * (half * 0.45), hipY - 1); ctx.lineTo(lx, footY2 - 3); ctx.stroke();
    ctx.strokeStyle = robeLine; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(hipX + s * (half * 0.45), hipY - 1); ctx.lineTo(lx, footY2 - 3); ctx.stroke();
    // bare foot
    ctx.fillStyle = skin; ctx.strokeStyle = ink; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.ellipse(lx + dir * 2, footY2 - 1, 5.2 * scale, 3.2 * scale, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  // ===== gi jacket (rounded little torso, crossed front, sleeves) =====
  const jl = hipX - half, jr = hipX + half;
  ctx.fillStyle = robe; ctx.strokeStyle = ink; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(jl + 2, bodyTopY + 3);
  ctx.quadraticCurveTo(hipX, bodyTopY - 3, jr - 2, bodyTopY + 3);   // rounded shoulders
  ctx.lineTo(jr + 1, hipY + 2);
  ctx.quadraticCurveTo(hipX, hipY + 6, jl - 1, hipY + 2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // soft side shade for volume
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(jl + 2, bodyTopY + 3);
  ctx.quadraticCurveTo(hipX, bodyTopY - 3, jr - 2, bodyTopY + 3);
  ctx.lineTo(jr + 1, hipY + 2);
  ctx.quadraticCurveTo(hipX, hipY + 6, jl - 1, hipY + 2);
  ctx.closePath(); ctx.clip();
  const sg = ctx.createLinearGradient(jl, 0, jr, 0);
  sg.addColorStop(0, "rgba(0,0,0,0)");
  sg.addColorStop(dir > 0 ? 1 : 0, "rgba(70,55,35,0.18)");
  ctx.fillStyle = sg; ctx.fillRect(jl - 2, bodyTopY - 4, bodyW + 4, bodyH + 12);
  ctx.restore();
  // crossed lapel V
  ctx.strokeStyle = robeLine; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hipX - half * 0.62, bodyTopY + 2);
  ctx.lineTo(hipX, hipY - 4);
  ctx.lineTo(hipX + half * 0.62, bodyTopY + 2);
  ctx.stroke();
  // inner collar line
  ctx.strokeStyle = "rgba(50,40,28,0.35)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(hipX, bodyTopY + 1); ctx.lineTo(hipX, hipY - 5); ctx.stroke();

  // ===== belt (colored obi — team color) =====
  const beltY = hipY - 6 * scale;
  const beltH = 6 * scale;
  ctx.fillStyle = color;
  roundRect(jl - 1, beltY, bodyW + 2, beltH, 2); ctx.fill();
  ctx.fillStyle = shade(color, 22);
  ctx.fillRect(jl - 1, beltY, bodyW + 2, 1.6);     // top highlight
  ctx.fillStyle = shade(color, -28);
  ctx.fillRect(jl - 1, beltY + beltH - 1.6, bodyW + 2, 1.6); // bottom shade
  // belt knot + two hanging tails
  ctx.fillStyle = shade(color, -16);
  roundRect(hipX - 3.5 * scale, beltY - 0.5, 7 * scale, beltH + 1, 1.5); ctx.fill();
  ctx.fillStyle = color;
  ctx.fillRect(hipX - 3 * scale, beltY + beltH - 1, 2.6 * scale, 9 * scale);
  ctx.fillRect(hipX + 0.6 * scale, beltY + beltH - 1, 2.6 * scale, 7 * scale);

  // ===== arms / sleeves (drawn over jacket) =====
  ctx.strokeStyle = robe; ctx.lineWidth = 7.5 * scale; ctx.lineCap = "round";
  const shY = bodyTopY + 5;
  const drawSleeve = (x1, y1, x2, y2) => {
    ctx.strokeStyle = robe;      ctx.lineWidth = 7.5 * scale;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = robeLine;  ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  };
  const fist = (fx, fy, r) => {
    ctx.fillStyle = skin; ctx.strokeStyle = ink; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  };
  if (action === "punch") {
    const reach = 24 * scale;
    const fistX = hipX + dir * reach, fistY = shY + 3;
    drawSleeve(hipX - dir * half * 0.45, shY + 1, hipX - dir * (half + 2), shY + 9); // rear guard
    fist(hipX - dir * (half + 2), shY + 9, 4 * scale);
    drawSleeve(hipX + dir * half * 0.35, shY, fistX, fistY);                         // strike
    fist(fistX, fistY, 5 * scale);
  } else if (action === "jump") {
    drawSleeve(hipX - half * 0.5, shY, hipX - half - 5, shY - 13);
    fist(hipX - half - 5, shY - 13, 3.6 * scale);
    drawSleeve(hipX + half * 0.5, shY, hipX + half + 5, shY - 13);
    fist(hipX + half + 5, shY - 13, 3.6 * scale);
  } else {
    const s = armSwing * 5;
    drawSleeve(hipX - half * 0.5, shY, hipX - dir * 5 - s, shY + 12);
    fist(hipX - dir * 5 - s, shY + 12, 3.6 * scale);
    drawSleeve(hipX + half * 0.5, shY, hipX + dir * 5 + s, shY + 11);
    fist(hipX + dir * 5 + s, shY + 11, 3.6 * scale);
  }

  // ===== BIG chibi head =====
  // head fill + outline
  ctx.fillStyle = skin; ctx.strokeStyle = ink; ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.ellipse(headCX, headCY, headR, headR * 1.02, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // soft cheek/jaw shade
  ctx.save();
  ctx.beginPath(); ctx.ellipse(headCX, headCY, headR, headR * 1.02, 0, 0, Math.PI * 2); ctx.clip();
  const hg = ctx.createLinearGradient(headCX - headR, 0, headCX + headR, 0);
  hg.addColorStop(0, "rgba(255,240,210,0.25)");
  hg.addColorStop(1, "rgba(150,110,70,0.18)");
  if (dir < 0) { hg.addColorStop(0, "rgba(150,110,70,0.18)"); hg.addColorStop(1, "rgba(255,240,210,0.25)"); }
  ctx.fillStyle = hg; ctx.fillRect(headCX - headR, headCY - headR, headR * 2, headR * 2.1);
  ctx.restore();

  // hair: a rounded cap with little spikes/fringe over the brow
  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.moveTo(headCX - headR * 0.98, headCY - headR * 0.18);
  ctx.quadraticCurveTo(headCX - headR * 1.05, headCY - headR * 1.05, headCX, headCY - headR * 1.12);
  ctx.quadraticCurveTo(headCX + headR * 1.05, headCY - headR * 1.05, headCX + headR * 0.98, headCY - headR * 0.18);
  // little fringe scallops along the brow
  const fr = headR * 0.98;
  for (let i = 2; i >= -2; i--) {
    const fx = headCX + (i / 2.6) * fr;
    ctx.quadraticCurveTo(fx + fr * 0.12, headCY - headR * 0.02, fx, headCY - headR * 0.30);
    ctx.quadraticCurveTo(fx - fr * 0.12, headCY - headR * 0.02, fx - fr * 0.18, headCY - headR * 0.12);
  }
  ctx.closePath(); ctx.fill();
  // hair sheen
  ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(headCX, headCY - headR * 0.55, headR * 0.7, Math.PI * 1.15, Math.PI * 1.6);
  ctx.stroke();

  // ===== hachimaki (headband in team color, across the forehead) =====
  const bandY = headCY - headR * 0.30;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(headCX, headCY, headR, headR * 1.02, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = color;
  ctx.fillRect(headCX - headR - 2, bandY - headR * 0.16, headR * 2 + 4, headR * 0.34);
  ctx.fillStyle = shade(color, -26);
  ctx.fillRect(headCX - headR - 2, bandY + headR * 0.10, headR * 2 + 4, headR * 0.07);
  ctx.fillStyle = shade(color, 26);
  ctx.fillRect(headCX - headR - 2, bandY - headR * 0.16, headR * 2 + 4, headR * 0.06);
  // knot
  const knotX = headCX - dir * headR * 0.9;
  ctx.fillStyle = shade(color, -14);
  ctx.beginPath(); ctx.arc(knotX, bandY, headR * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // trailing band tails (outside the head, behind facing)
  ctx.fillStyle = color;
  const tx0 = headCX - dir * headR * 0.92;
  const flick = hit ? -3 : Math.sin(now / 240) * 1.5;
  ctx.beginPath();
  ctx.moveTo(tx0, bandY - 2);
  ctx.quadraticCurveTo(tx0 - dir * 12, bandY - 1 + flick, tx0 - dir * 16, bandY + 4 + flick);
  ctx.lineTo(tx0 - dir * 12, bandY + 4);
  ctx.quadraticCurveTo(tx0 - dir * 6, bandY + 3, tx0, bandY + 3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx0, bandY + 1);
  ctx.quadraticCurveTo(tx0 - dir * 9, bandY + 7 - flick * 0.5, tx0 - dir * 13, bandY + 11);
  ctx.lineTo(tx0 - dir * 9, bandY + 9);
  ctx.quadraticCurveTo(tx0 - dir * 4, bandY + 6, tx0, bandY + 5);
  ctx.closePath(); ctx.fill();

  // ===== expressive face =====
  const eyeY = headCY + headR * 0.12;
  const eyeDX = headR * 0.34;
  const eyeOff = dir * headR * 0.08;   // look toward opponent
  if (!off) {
    // determined eyebrows
    ctx.strokeStyle = "#3a2a1c"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    const browY = eyeY - headR * 0.34;
    const angry = (action === "punch") ? 1.0 : 0.55;   // sharper brow on attack
    ctx.beginPath();
    ctx.moveTo(headCX - eyeDX - headR * 0.16, browY - angry * 2.4);
    ctx.lineTo(headCX - eyeDX + headR * 0.18, browY + angry * 1.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(headCX + eyeDX + headR * 0.16, browY - angry * 2.4);
    ctx.lineTo(headCX + eyeDX - headR * 0.18, browY + angry * 1.6);
    ctx.stroke();
    // big chibi eyes (white + dark iris + catchlight)
    for (const s of [-1, 1]) {
      const ex = headCX + s * eyeDX + eyeOff;
      ctx.fillStyle = "#fbf6ec"; ctx.strokeStyle = "#33281d"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(ex, eyeY, headR * 0.20, headR * 0.27, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#241a12";
      ctx.beginPath(); ctx.arc(ex + dir * headR * 0.05, eyeY + headR * 0.03, headR * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath(); ctx.arc(ex + dir * headR * 0.05 - 1.4, eyeY - headR * 0.02, headR * 0.045, 0, Math.PI * 2); ctx.fill();
    }
    // small mouth — set jaw when punching, neutral otherwise
    ctx.strokeStyle = "#7a4a36"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    const my = headCY + headR * 0.55;
    ctx.beginPath();
    if (action === "punch") { ctx.moveTo(headCX - headR * 0.16, my - 1); ctx.lineTo(headCX + headR * 0.16, my - 1); }
    else { ctx.arc(headCX, my - headR * 0.10, headR * 0.16, 0.2 * Math.PI, 0.8 * Math.PI); }
    ctx.stroke();
    // tiny cheek blush
    ctx.fillStyle = "rgba(224,120,90,0.16)";
    ctx.beginPath(); ctx.arc(headCX - headR * 0.5, headCY + headR * 0.42, headR * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(headCX + headR * 0.5, headCY + headR * 0.42, headR * 0.14, 0, Math.PI * 2); ctx.fill();
  } else {
    // KO: >_< eyes + open mouth
    ctx.strokeStyle = "#33281d"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      const ex = headCX + s * eyeDX;
      ctx.beginPath();
      ctx.moveTo(ex - headR * 0.14, eyeY - headR * 0.12); ctx.lineTo(ex + headR * 0.14, eyeY + headR * 0.12);
      ctx.moveTo(ex - headR * 0.14, eyeY + headR * 0.12); ctx.lineTo(ex + headR * 0.14, eyeY - headR * 0.12);
      ctx.stroke();
    }
    ctx.fillStyle = "#7a4a36";
    ctx.beginPath(); ctx.arc(headCX, headCY + headR * 0.52, headR * 0.12, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  // remember the figure's "core" screen position for the tag follow (above head)
  b.__sx = headCX; b.__sy = headCY - headR * 1.1;
}

// A restrained sumi-ink impact: a thin shock-ring and a few short brush flecks,
// muted and translucent — reads as a felt strike, not a cartoon star sticker.
function impactBurst(b, color, geo, plat) {
  const { sx, sy } = geo;
  if (isOffEdge(b, plat)) return;
  const dir = (b.facing < 0) ? -1 : 1;
  const cx = sx(b.x) + dir * 40;   // forward of the extended fist (sprite-scale)
  const cy = sy(b.y) - 86;         // sprite fist / mid-torso height
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  // soft warm bloom (low, no hard white core)
  const bloom = ctx.createRadialGradient(cx, cy, 1, cx, cy, 16);
  bloom.addColorStop(0, "rgba(240,224,190,0.30)");
  bloom.addColorStop(1, "rgba(240,224,190,0)");
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  // thin shock ring in muted team color
  ctx.strokeStyle = withAlpha(color, 0.55); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI*2); ctx.stroke();
  // four short brush flecks forward of the fist
  ctx.strokeStyle = withAlpha(color, 0.7); ctx.lineWidth = 2; ctx.lineCap = "round";
  const base = dir > 0 ? 0 : Math.PI;
  for (const off of [-0.55, -0.18, 0.18, 0.55]) {
    const a = base + off;
    const r0 = 8, r1 = 8 + (Math.abs(off) < 0.3 ? 9 : 6);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.stroke();
  }
  ctx.restore();
}

// ===================================================================== floating tags (eased follow)
function drawTag(slot, b, label, color, geo, plat, dt, hit, ko) {
  // target = above the fighter's head
  const tx = (b.__sx != null) ? b.__sx : geo.sx(b.x);
  const ty = (b.__sy != null) ? b.__sy : geo.sy(b.y) - 56;
  const targetX = tx;
  const targetY = ty - 26;

  // ease the tag toward the target (critically-damped-ish lerp)
  const s = tagState[slot] || (tagState[slot] = { x: targetX, y: targetY });
  const k = 1 - Math.pow(0.0001, dt); // frame-rate independent smoothing
  s.x += (targetX - s.x) * Math.min(1, k * 4);
  s.y += (targetY - s.y) * Math.min(1, k * 4);

  // tag geometry
  const text = label;
  ctx.font = "700 12px ui-sans-serif, system-ui";
  const tw = ctx.measureText(text).width;
  const padX = 9, padY = 5, dot = 7;
  const w = tw + padX * 2 + dot + 6;
  const h = 22;
  let x = s.x - w / 2;
  let y = s.y - h;
  // clamp to canvas
  x = Math.max(6, Math.min(x, geo.W - w - 6));
  y = Math.max(6, y);

  ctx.save();
  // hit-flash: tag pulses bright, KO: tag desaturates + 'KO'
  const flash = hit ? 1 : 0;

  // pointer/leader line from tag to head
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(s.x, y + h); ctx.lineTo(tx, ty + 4); ctx.stroke();

  // body
  const bg = ko ? "rgba(60,52,42,0.92)" : flash ? mix(color, "#ffffff", 0.55) : "rgba(28,20,12,0.9)";
  ctx.fillStyle = bg;
  ctx.strokeStyle = ko ? "rgba(150,140,120,0.7)" : color;
  ctx.lineWidth = flash ? 2.5 : 1.5;
  roundRect(x, y, w, h, 7); ctx.fill(); ctx.stroke();

  // color dot
  ctx.fillStyle = ko ? "#8a7458" : color;
  ctx.beginPath(); ctx.arc(x + padX + dot/2, y + h/2, dot/2, 0, Math.PI*2); ctx.fill();

  // text
  ctx.fillStyle = flash ? "#1a120a" : "#f3e9d8";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(text, x + padX + dot + 6, y + h/2 + 0.5);

  // KO badge (clamped so it never spills off the canvas edge)
  if (ko) {
    ctx.fillStyle = "#b1392f";
    ctx.font = "700 9.5px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.letterSpacing = "1.5px";
    const badgeX = Math.max(48, Math.min(s.x, geo.W - 48));
    ctx.fillText("RING-OUT", badgeX, y - 6);
    ctx.letterSpacing = "0px";
  } else if (hit) {
    // a small muted strike-dot over the tag (no emoji)
    ctx.fillStyle = withAlpha(color, 0.85);
    ctx.beginPath(); ctx.arc(x + w - 7, y + 4, 2.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ===================================================================== small canvas utils
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, amt) {
  const c = hexToRgb(hex); if (!c) return hex;
  const f = (v) => Math.max(0, Math.min(255, v + amt));
  return `rgb(${f(c.r)},${f(c.g)},${f(c.b)})`;
}
function withAlpha(col, a) {
  const c = hexToRgb(col) || { r: 200, g: 160, b: 80 };
  return `rgba(${c.r},${c.g},${c.b},${a})`;
}
function mix(a, b, t) {
  const ca = hexToRgb(a) || {r:200,g:200,b:200};
  const cb = hexToRgb(b) || {r:255,g:255,b:255};
  const m = (x,y) => Math.round(x + (y - x) * t);
  return `rgb(${m(ca.r,cb.r)},${m(ca.g,cb.g)},${m(ca.b,cb.b)})`;
}
// tiny seeded PRNG so wall grunge / leaf scatter is stable across renders
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexToRgb(hex) {
  let h = String(hex).trim();
  if (h.startsWith("rgb")) {
    const m = h.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    return m ? { r:+m[1], g:+m[2], b:+m[3] } : null;
  }
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  if (h.length !== 6) return null;
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}

// ===================================================================== transport
function play() {
  if (!replay) return;
  if (frame >= replay.frames.length - 1) frame = 0;
  playing = true; playBtn.textContent = "Pause"; playBtn.classList.add("playing");
  clearInterval(timer);
  const ms = parseInt($("speed").value, 10);
  timer = setInterval(() => {
    if (frame >= replay.frames.length - 1) { pause(); requestRender(); return; }
    frame++; requestRender();
  }, ms);
}
function pause() { playing = false; playBtn.textContent = "Play"; playBtn.classList.remove("playing"); clearInterval(timer); }
function togglePlay() { playing ? pause() : play(); }
function step(d) { pause(); frame += d; requestRender(); }

// ===================================================================== wiring
playBtn.onclick = togglePlay;
$("stepFwd").onclick = () => step(1);
$("stepBack").onclick = () => step(-1);
scrub.oninput = () => { pause(); frame = parseInt(scrub.value, 10); paintScrub(); requestRender(); };
$("speed").onchange = () => { if (playing) play(); };
sel.onchange = () => { if (sel.value) loadExample(sel.value); };
$("fileInput").onchange = (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); };

const drop = $("drop");
["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("hot"); }));
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.target.id !== "drop" && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); step(-1); }
});
window.addEventListener("resize", requestRender);

// ===================================================================== boot
// Fighters are the procedural karate figures from sprite_anim.js — no sheets to
// preload; getAnimator() builds them lazily once the ES module is live.

// Optional real-art backdrop (assets/dojo.png) — used if it loads.
(function tryDojoArt() {
  const img = new Image();
  img.onload = () => { dojoImg = img; dojoImgReady = true; requestRender(); };
  img.onerror = () => { dojoImgReady = false; };
  img.src = DOJO_IMG_URL;
})();

// Inline default first so the canvas is never blank (works from file://).
setReplay(DEFAULT_REPLAY, "inline-demo");

// Then upgrade over http: load dashboard + manifest + descriptive dropdown,
// and auto-open the headline draw match if available.
(async () => {
  // dashboard (for spec panels) — best effort
  try {
    const res = await fetch(DASHBOARD_URL, { cache: "no-store" });
    if (res.ok) { dashboard = await res.json(); renderSpecPanels(); }
  } catch (_) { /* file:// — keep panels from meta only */ }

  // manifest -> descriptive dropdown
  let files = null;
  try {
    const res = await fetch(MANIFEST_URL, { cache: "no-store" });
    if (res.ok) files = await res.json();
  } catch (_) { /* fall through */ }
  if (!Array.isArray(files) || !files.length) {
    // try a directory listing as a secondary source
    try {
      const res = await fetch(REPLAY_BASE, { cache: "no-store" });
      if (res.ok) {
        const html = await res.text();
        files = Array.from(html.matchAll(/href="([^"]+\.json)"/g))
          .map(m => decodeURIComponent(m[1].split("/").pop()))
          .filter(n => n && n !== "manifest.json");
        files = Array.from(new Set(files));
      }
    } catch (_) { /* ignore */ }
  }

  // optional URL overrides: ?r=<file> picks a match, &f=<frame> jumps to it.
  const params = new URLSearchParams(location.search);
  const wantFile = params.get("r");
  const wantFrame = params.get("f");

  if (Array.isArray(files) && files.length) {
    await buildDropdown(files);
    // explicit ?r= wins; otherwise the headline h2h draw (the centerpiece story).
    let pick = null;
    if (wantFile) {
      pick = manifestEntries.find(e => e.file === wantFile) ||
             manifestEntries.find(e => e.file.includes(wantFile));
    }
    pick = pick ||
      manifestEntries.find(e => /h2h_fighter_draw_trained_as_P1/.test(e.file)) ||
      manifestEntries.find(e => /h2h_fighter_draw/.test(e.file)) ||
      manifestEntries.find(e => e.key === "ringout");
    if (pick) {
      sel.value = pick.file;
      await loadExample(pick.file);
      if (wantFrame != null && replay) {
        frame = Math.max(0, Math.min(parseInt(wantFrame, 10) || 0, replay.frames.length - 1));
        requestRender();
      }
    }
    loadErr.textContent = "";
  } else {
    fallbackDropdown();
  }
})();
</script>
</body>
</html>
