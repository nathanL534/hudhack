<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DOJO — Sensei vs Sensei · Replay Viewer</title>
<style>
  :root {
    /* dojo palette — sumi-ink ground, warm washi, muted lacquer accents */
    --bg:        #0c0a09;     /* sumi-ink near-black ground */
    --bg2:       #070605;
    --panel:     #14110d;     /* calm dark panel */
    --panel2:    #1a1611;
    --line:      #2a231b;     /* quiet hairline */
    --line2:     #3a3025;
    --ink:       #efe6d6;
    --muted:     #a8967a;
    --muted2:    #786650;
    --paper:     #ece1c8;
    --lacquer:   #8a2a20;     /* deep red lacquer */
    --gold:      #c8972e;
    --orange:    #e08c3f;     /* warm brand orange — the kanji + "Match" label */
    /* the two students — belt colors (muted, never neon) */
    --trained:   #c4453c;     /* muted red — trained student (good sensei) */
    --base:      #4a63b0;     /* muted blue — base student (base sensei) */
    --accent:    #c8972e;
    --warn:      #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 680px at 50% -14%, #19140e 0%, var(--bg) 52%, var(--bg2) 100%);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* full-width header band — single dark row, comfortable padding, thin divider below.
     Left: large orange kanji + title stack. Right: inline two-item legend. */
  header {
    padding: 22px 40px 20px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line2);
    box-shadow: 0 1px 0 rgba(0,0,0,.5);
  }
  .brand {
    display: flex; align-items: center; gap: 20px; min-width: 0;
  }
  .kanji {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif;
    font-size: 50px; line-height: .92;
    color: var(--orange);
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 rgba(0,0,0,.35);
    flex: none;
  }
  .headtxt { display: flex; flex-direction: column; min-width: 0; }
  header h1 {
    font-size: 28px; margin: 0; line-height: 1.06; letter-spacing: .2px;
    font-weight: 800; color: var(--ink); white-space: nowrap;
  }
  header h1 .lite { font-weight: 500; color: var(--ink); }
  header h1 .dim  { color: var(--muted2); font-weight: 400; margin: 0 8px; }
  header .sub { color: var(--muted); font-size: 14.5px; margin-top: 5px; letter-spacing: .1px; }

  .legend {
    margin-left: auto; display: flex; gap: 40px; align-items: center;
    font-size: 14.5px; flex-wrap: wrap; color: var(--muted);
  }
  .legend > span { display: inline-flex; align-items: center; white-space: nowrap; }
  .legend .dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    margin-right: 11px; flex: none;
    box-shadow: 0 0 0 3px rgba(0,0,0,.25);
  }
  .legend b { font-weight: 600; color: var(--ink); margin-right: 7px; }
  .legend .sep { color: var(--muted2); margin: 0 7px 0 0; }

  /* main fills the remaining viewport height so there is no dead void below the arena */
  main {
    flex: 1;
    width: 100%;
    margin: 0 auto;
    padding: 20px 40px 26px;
    display: flex; flex-direction: column;
  }

  .controls-bar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .controls-bar .lbl { color: var(--orange); font-weight: 700; font-size: 15px; letter-spacing: .2px; }

  select, button, label.file {
    background: #181410; color: var(--ink);
    border: 1px solid var(--line2); border-radius: 10px;
    padding: 10px 16px; font-size: 13.5px; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, transform .05s;
  }
  select { min-width: 300px; }
  /* speed selector is tiny ("1.5x") — must NOT inherit the 300px match-dropdown width,
     or it overflows the controls row and wraps to its own line. */
  #speed { min-width: 0; width: auto; flex: none; padding-left: 12px; padding-right: 12px; }
  select optgroup { color: var(--gold); font-style: normal; font-weight: 700; background: #100d0a; }
  select option { color: var(--ink); background: #181410; font-weight: 400; }
  button:hover, label.file:hover, select:hover { border-color: var(--line2); background: #211b15; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }

  /* Import Replay button — quiet, with an upload glyph */
  .btn-import { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); }
  .btn-import .ic {
    width: 13px; height: 13px; position: relative; display: inline-block;
  }
  .btn-import .ic::before { /* arrow shaft + head */
    content: ""; position: absolute; left: 5px; top: 0; width: 3px; height: 8px; background: var(--muted);
  }
  .btn-import .ic::after {
    content: ""; position: absolute; left: 2px; top: 0; width: 8px; height: 8px;
    border-left: 2px solid var(--muted); border-top: 2px solid var(--muted);
    transform: rotate(45deg); transform-origin: top left;
  }
  .btn-import .tray {
    position: absolute; left: 0; bottom: 0; width: 13px; height: 4px;
    border: 2px solid var(--muted); border-top: 0; border-radius: 0 0 2px 2px;
  }
  .btn-import:hover .ic::before, .btn-import:hover .ic::after { background: var(--accent); border-color: var(--accent); }
  .btn-import:hover .tray { border-color: var(--accent); }

  /* transport cluster — separated rounded pills, amber standalone Play */
  .transport-cluster {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .transport-cluster .tb {
    background: #181410; border: 1px solid var(--line2);
    border-radius: 10px; padding: 10px 16px; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px;
    transition: border-color .15s, background .15s, color .15s, transform .05s;
  }
  .transport-cluster .tb .gl,
  .transport-cluster .tb .gl-chev,
  .transport-cluster .tb .gl-bar { opacity: .8; }
  .transport-cluster .tb:hover { background: #211b15; border-color: var(--line2); color: var(--ink); }
  .transport-cluster .tb:active { transform: translateY(1px); }
  .transport-cluster .tb.play {
    color: #1c1408; font-weight: 700; padding: 10px 22px;
    border-color: #b9882a;
    background: linear-gradient(180deg, #e7b54a, var(--gold));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.30), 0 4px 14px rgba(200,151,46,.28);
  }
  .transport-cluster .tb.play .gl { opacity: 1; }
  .transport-cluster .tb.play:hover { background: linear-gradient(180deg, #efbe55, #d4a234); }
  /* glyphs */
  .gl { width: 0; height: 0; display: inline-block; }
  .gl-play { border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .tb.playing .gl-play { width: 8px; height: 11px; border: 0; background: linear-gradient(90deg, currentColor 0 3px, transparent 3px 5px, currentColor 5px 8px); }
  .gl-chev { width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; }
  .gl-prev { transform: rotate(135deg); }
  .gl-next { transform: rotate(-45deg); }
  .gl-end { display: inline-flex; align-items: center; gap: 0; }
  .gl-bar { width: 2px; height: 11px; background: currentColor; }
  #drop { display: none; }
  #loadErr { color: var(--warn); font-size: 12px; margin-top: 10px; min-height: 1px; }

  /* === arena layout: panel | stage | panel ===
     reference proportions @1672w → 277 : 1037 : 276 ≈ 1 : 3.75 : 1, ~20px gutters.
     Fixed side columns so the central arena stays the dominant element. */
  .arena {
    margin-top: 16px;
    flex: 1;
    display: grid;
    grid-template-columns: 288px minmax(560px, 1fr) 288px;
    gap: 24px;
    align-items: stretch;
  }
  @media (max-width: 1280px) {
    .arena { grid-template-columns: 252px minmax(480px, 1fr) 252px; gap: 18px; }
  }
  @media (max-width: 1080px) {
    .arena { grid-template-columns: 1fr; }
    .spec-panel { order: 3; }
    .stage-wrap { order: 1; }
  }

  /* === spec panels === */
  .spec-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 24px 22px 22px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 14px 38px rgba(0,0,0,.45);
  }
  /* a single quiet accent edge — the only team color on the panel chrome */
  .spec-panel.left::before, .spec-panel.right::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 4px;
  }
  .spec-panel.left::before  { left: 0;  background: linear-gradient(180deg, var(--trained), #7c2a23); }
  .spec-panel.right::before { right: 0; background: linear-gradient(180deg, var(--base), #2f3f72); }

  /* the name/avatar header: role + name + sensei stacked, portrait floated to the
     inner edge and dropped to the pill line (so the name keeps a full-width line). */
  .panel-head { position: relative; min-height: 116px; padding-right: 8px; }
  .spec-panel .role {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .spec-panel.left  .role { color: #d68a82; }
  .spec-panel.right .role { color: #8fa3da; }
  .spec-panel .name { font-size: 21px; font-weight: 700; margin-top: 12px; letter-spacing: .2px; line-height: 1.18; white-space: nowrap; }
  .spec-panel .sensei { font-size: 13px; color: var(--muted); margin-top: 5px; }

  /* circular gi avatar portrait — pinned to the inner corner, dropped to the pill row */
  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    position: absolute; bottom: -10px; right: 0;
    background:
      radial-gradient(70% 70% at 50% 32%, #241c14 0%, #15110c 100%);
    border: 1px solid var(--line2);
    display: grid; place-items: center; overflow: hidden;
  }
  .spec-panel.right .avatar { right: 0; left: auto; }
  .spec-panel.left  .avatar { box-shadow: inset 0 0 0 4px rgba(0,0,0,.25), 0 0 0 2px rgba(196,69,60,.45); }
  .spec-panel.right .avatar { box-shadow: inset 0 0 0 4px rgba(0,0,0,.25), 0 0 0 2px rgba(74,99,176,.45); }
  .avatar canvas { display: block; width: 92px; height: 92px; }

  .side-pill {
    align-self: flex-start; margin-top: 16px; padding: 5px 16px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .4px;
    border: 1px solid transparent;
  }
  .side-pill.trained { color: #e0938d; border-color: rgba(196,69,60,.55); background: rgba(196,69,60,.10); }
  .side-pill.base    { color: #9fb0e0; border-color: rgba(74,99,176,.55);  background: rgba(74,99,176,.10); }

  .spec-rows { margin-top: 22px; }
  .spec-row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
    font-size: 14px; align-items: baseline;
  }
  .spec-row .k { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .spec-row .v { color: var(--ink); text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .spec-row .v.dimv { color: var(--muted2); font-weight: 500; }
  .spec-row .v .win-mark {
    color: var(--gold); font-weight: 700; margin-left: 7px; font-size: 12px;
  }
  .spec-section {
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--muted2); font-weight: 700; padding: 16px 0 2px;
  }
  .spec-extra { display: none; }
  .spec-extra.open { display: block; }

  /* View Details toggle — pinned to the bottom of the panel */
  .details-btn {
    margin-top: auto; width: 100%;
    background: transparent; border: 1px solid var(--line2); border-radius: 10px;
    padding: 13px; color: var(--accent); font-weight: 600; font-size: 13.5px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .details-btn:hover { background: #1c1812; color: var(--ink); border-color: var(--line2); }
  .details-btn .chev {
    width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg); transition: transform .18s; margin-top: -2px;
  }
  .details-btn.open .chev { transform: rotate(-135deg); margin-top: 2px; }

  /* === stage === */
  .stage-wrap {
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: 0 14px 38px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
  }
  .canvas-frame {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid #120e09;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    flex: 1;
    /* hold the reference's taller arena shape regardless of column width */
    aspect-ratio: 1000 / 640;
    min-height: 0;
  }
  #canvas { display: block; width: 100%; height: 100%; background: #100b06; }

  .transport { display: flex; gap: 16px; align-items: center; margin-top: 16px; padding: 2px 6px 0; }
  .transport .ts {
    font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px;
    min-width: 90px; letter-spacing: .3px;
  }
  .transport .ts.right { text-align: right; }
  .transport input[type=range] {
    flex: 1; min-width: 120px; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--line2); border-radius: 4px; cursor: pointer; accent-color: var(--gold);
  }
  .transport input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--gold); margin-top: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .transport input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--ink); border: 2px solid var(--gold);
  }
  .fs-btn {
    background: transparent; border: 0; padding: 4px; color: var(--muted); cursor: pointer;
    width: 22px; height: 22px; position: relative; flex: none;
  }
  .fs-btn:hover { color: var(--ink); background: transparent; }
  .fs-btn .c { position: absolute; width: 7px; height: 7px; }
  .fs-btn .c1 { top: 2px; left: 2px;  border-left: 2px solid currentColor; border-top: 2px solid currentColor; }
  .fs-btn .c2 { top: 2px; right: 2px; border-right: 2px solid currentColor; border-top: 2px solid currentColor; }
  .fs-btn .c3 { bottom: 2px; left: 2px;  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; }
  .fs-btn .c4 { bottom: 2px; right: 2px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; }

  /* The big victory plaque is gone by design — the outcome reads quietly in the
     side panels (see "Outcome" row + small winner mark). #banner is kept in the
     DOM but never shown, so legacy show/hideVerdict calls are harmless no-ops. */
  #banner { display: none !important; }
</style>
<!-- premium dojo theme — layers on top of the inline <style> above -->
<link rel="stylesheet" href="theme.css" />
<!-- game-feel + procedural fighter modules (verified drop-ins).
     effects.js is a classic script (sets window.DojoFX). sprite_anim.js carries
     ES `export`s so it must load as a module; its IIFE also sets window.SpriteAnim
     synchronously. We mark when both are live so the render loop can switch to the
     animated figures and repaint. -->
<script src="effects.js"></script>
<script type="module">
  import { SpriteAnimator, selectAction } from "./sprite_anim.js";
  // surface the procedural engine to the classic inline script
  window.SpriteAnim = window.SpriteAnim || {};
  window.SpriteAnim.SpriteAnimator = SpriteAnimator;
  window.SpriteAnim.selectAction = selectAction;
  window.__spritesModuleReady = true;
  // repaint now that the animated figures are available
  if (typeof window.requestRender === "function") window.requestRender();
</script>
</head>
<body>
<header>
  <div class="brand">
    <span class="kanji">道場</span>
    <div class="headtxt">
      <h1>DOJO<span class="dim">·</span><span class="lite">Sensei vs Sensei</span></h1>
      <span class="sub">Two students. One trained by a sharper sensei.</span>
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--trained)"></span><b>Trained Student</b> <span class="sep">—</span> good sensei</span>
    <span><span class="dot" style="background:var(--base)"></span><b>Base Student</b> <span class="sep">—</span> base sensei</span>
  </div>
</header>

<main>
  <div class="controls-bar">
    <span class="lbl">Match</span>
    <select id="replaySel"></select>
    <label class="file btn-import" title="Load a replay .json">
      <span class="ic"><span class="tray"></span></span> Import Replay
      <input id="fileInput" type="file" accept=".json,application/json" hidden />
    </label>
    <div id="drop"></div>
    <div class="transport-cluster" style="margin-left:auto">
      <button id="firstBtn" class="tb" title="First frame"><span class="gl gl-chev gl-prev"></span><span class="gl-bar" style="margin-left:-4px"></span> First</button>
      <button id="stepBack" class="tb" title="Previous frame"><span class="gl gl-chev gl-prev"></span> Prev</button>
      <button id="playBtn" class="tb play" title="Play / pause"><span class="gl gl-play"></span> <span id="playLbl">Play</span></button>
      <button id="stepFwd" class="tb" title="Next frame">Next <span class="gl gl-chev gl-next"></span></button>
      <button id="lastBtn" class="tb" title="Last frame">Last <span class="gl-bar" style="margin-right:-4px"></span><span class="gl gl-chev gl-next"></span></button>
      <select id="speed" title="playback speed">
        <option value="33">2x</option>
        <option value="50" selected>1.5x</option>
        <option value="66">1x</option>
        <option value="100">0.75x</option>
        <option value="200">0.5x</option>
      </select>
    </div>
  </div>
  <div id="loadErr"></div>

  <div class="arena">
    <!-- LEFT spec panel (trained student) -->
    <aside class="spec-panel left" id="panelL">
      <div class="panel-head">
        <div class="role"><span class="dot" id="L_dot"></span><span id="L_pslot">Player 2</span> <span class="sep">/</span> <span id="L_role">Student</span></div>
        <div class="name" id="L_name">—</div>
        <div class="sensei" id="L_sensei">—</div>
        <div class="avatar"><canvas id="L_avatar" width="92" height="92"></canvas></div>
      </div>
      <span class="side-pill" id="L_pill">—</span>
      <div class="spec-rows" id="L_rows"></div>
      <button class="details-btn" id="L_details">View Details <span class="chev"></span></button>
    </aside>

    <!-- CENTER stage -->
    <section class="stage-wrap">
      <div class="canvas-frame">
        <canvas id="canvas" width="1000" height="640"></canvas>
      </div>
      <div class="transport">
        <span class="ts" id="timeCur">00:00.000</span>
        <input id="scrub" type="range" min="0" max="0" value="0" />
        <span class="ts right" id="timeTot">00:00.000</span>
        <button class="fs-btn" id="fsBtn" title="Fullscreen"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span></button>
      </div>
      <div id="banner"></div>
    </section>

    <!-- RIGHT spec panel (base student) -->
    <aside class="spec-panel right" id="panelR">
      <div class="panel-head">
        <div class="role"><span class="dot" id="R_dot"></span><span id="R_pslot">Player 1</span> <span class="sep">/</span> <span id="R_role">Student</span></div>
        <div class="name" id="R_name">—</div>
        <div class="sensei" id="R_sensei">—</div>
        <div class="avatar"><canvas id="R_avatar" width="92" height="92"></canvas></div>
      </div>
      <span class="side-pill" id="R_pill">—</span>
      <div class="spec-rows" id="R_rows"></div>
      <button class="details-btn" id="R_details">View Details <span class="chev"></span></button>
    </aside>
  </div>
</main>

<script>
"use strict";
// ===================================================================== config
const REPLAY_BASE   = "../replays/";
const MANIFEST_URL  = REPLAY_BASE + "manifest.json";
const DASHBOARD_URL = "../output/stage6_report/dashboard.json";
const DOJO_IMG_URL  = "assets/dojo.png";   // optional real-art backdrop

// ===================================================================== sprite assets
// Real CC0 fighter sprite sheets — LuizMelo "Martial Hero" pack (itch.io,
// CC0 / Creative Commons Zero). Source repo (vendored copies):
//   https://github.com/chriscourses/fighting-game  (samuraiMack, kenji)
//   underlying art: https://luizmelo.itch.io/martial-hero  (CC0, free incl. commercial)
// Each sheet is a single horizontal row of 200x200 frames; the character art
// sits small + bottom-centred inside that 200px box (lots of transparent pad).
// We use one character per side so trained vs base read as two distinct students,
// then recolor each to the team color (red = Trained, blue = Base).
const SPRITE_FRAME = 200;                       // px per frame (square)
// Frame counts per animation, per character (verified from the PNG widths).
const SPRITE_CHARS = {
  samuraiMack: {
    dir: "assets/sprites/samuraiMack/",
    anims: {
      Idle:    { file: "Idle.png",    frames: 8 },
      Run:     { file: "Run.png",     frames: 8 },
      Jump:    { file: "Jump.png",    frames: 2 },
      Fall:    { file: "Fall.png",    frames: 2 },
      Attack1: { file: "Attack1.png", frames: 6 },
      Attack2: { file: "Attack2.png", frames: 6 },
      TakeHit: { file: "TakeHit.png", frames: 4 },
      Death:   { file: "Death.png",   frames: 6 },
    },
  },
  kenji: {
    dir: "assets/sprites/kenji/",
    anims: {
      Idle:    { file: "Idle.png",    frames: 4 },
      Run:     { file: "Run.png",     frames: 8 },
      Jump:    { file: "Jump.png",    frames: 2 },
      Fall:    { file: "Fall.png",    frames: 2 },
      Attack1: { file: "Attack1.png", frames: 4 },
      Attack2: { file: "Attack2.png", frames: 4 },
      TakeHit: { file: "TakeHit.png", frames: 3 },
      Death:   { file: "Death.png",   frames: 7 },
    },
  },
};
// Which character + team tint each side uses. Trained = red, Base = blue.
const TEAM_CHAR = { trained: "samuraiMack", base: "kenji" };

// Replay action -> animation name. punch alternates Attack1/Attack2.
function animForAction(action, opts) {
  const a = String(action || "idle").toLowerCase();
  if (opts && opts.ko)  return "Death";
  if (opts && opts.hit) return "TakeHit";
  if (a === "punch")    return (opts && opts.attack2) ? "Attack2" : "Attack1";
  if (a === "jump")     return (opts && opts.falling) ? "Fall" : "Jump";
  if (a === "left" || a === "right") return "Run";
  return "Idle";
}

// ---------- sprite store: load sheets, pre-bake a team-tinted copy of each ----------
// spriteStore[char][anim] = { base: Image, tinted: { trained, base } (canvas), frames }
const spriteStore = {};
let spritesReady = false;
let spritesPending = 0;

// Recolor a sprite sheet toward the team color while preserving the original
// luminance (so the cloth folds / shading survive). Two passes, both clipped to
// the sprite silhouette via 'source-atop':
//   1) 'color' blend stamps the team HUE onto the art (keeps brightness) — this
//      is what makes red read as red and blue as blue, not muddy purple.
//   2) a light 'overlay' pass deepens saturation in the mid-tones.
// 'source-atop' means each pass only paints over existing (opaque) pixels, so
// the transparent padding stays transparent.
function bakeTinted(img, rgb, strength) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0);
  const fill = `rgba(${rgb.r},${rgb.g},${rgb.b},1)`;

  // pass 1: transfer the team hue, keep the art's luminance
  x.globalCompositeOperation = "color";
  x.globalAlpha = strength;
  x.fillStyle = fill;
  x.fillRect(0, 0, c.width, c.height);

  // pass 2: punch up saturation a touch so the color is unmistakable
  x.globalCompositeOperation = "overlay";
  x.globalAlpha = strength * 0.45;
  x.fillStyle = fill;
  x.fillRect(0, 0, c.width, c.height);

  // clip everything back to the original silhouette (drop any spill on padding)
  x.globalCompositeOperation = "destination-in";
  x.globalAlpha = 1;
  x.drawImage(img, 0, 0);

  x.globalCompositeOperation = "source-over";
  x.globalAlpha = 1;
  return c;
}

function loadSprites() {
  const trainedRgb = hexToRgb(getCSS("--trained")) || { r: 196, g: 69, b: 60 };
  const baseRgb    = hexToRgb(getCSS("--base"))    || { r: 74, g: 99, b: 176 };
  for (const [char, def] of Object.entries(SPRITE_CHARS)) {
    spriteStore[char] = {};
    for (const [anim, info] of Object.entries(def.anims)) {
      const rec = { base: null, frames: info.frames, tinted: { trained: null, base: null } };
      spriteStore[char][anim] = rec;
      spritesPending++;
      const img = new Image();
      img.onload = () => {
        rec.base = img;
        rec.tinted.trained = bakeTinted(img, trainedRgb, 0.82);
        rec.tinted.base    = bakeTinted(img, baseRgb,    0.82);
        if (--spritesPending === 0) { spritesReady = true; }
        requestRender();
      };
      img.onerror = () => {
        // missing sheet: leave rec.base null; renderer falls back to the
        // procedural figure so the viewer never goes blank.
        if (--spritesPending === 0) { spritesReady = true; }
        requestRender();
      };
      img.src = def.dir + info.file;
    }
  }
}

// playback clock: traces are 15 native fps. Show mm:ss.mmm like the reference.
const NATIVE_FPS = 15;
function fmtTime(frameIdx) {
  const totalMs = Math.round((frameIdx / NATIVE_FPS) * 1000);
  const mm = Math.floor(totalMs / 60000);
  const ss = Math.floor((totalMs % 60000) / 1000);
  const ms = totalMs % 1000;
  return String(mm).padStart(2, "0") + ":" +
         String(ss).padStart(2, "0") + "." +
         String(ms).padStart(3, "0");
}

// ===================================================================== policy / role resolution
// "trained" student = policy name contains 'trained' but NOT 'base'.
// We NEVER assume P1 is trained — resolve from meta.p1_policy / p2_policy.
function classifyPolicy(name) {
  const p = String(name || "").toLowerCase();
  const trained = /trained/.test(p) && !/base/.test(p);
  const base    = /base/.test(p);
  return { trained, base, raw: name };
}
// Returns which slot ('p1'|'p2') is the trained side, or null if ambiguous.
function trainedSlot(meta) {
  const m = meta || {};
  const c1 = classifyPolicy(m.p1_policy), c2 = classifyPolicy(m.p2_policy);
  if (c1.trained && !c2.trained) return "p1";
  if (c2.trained && !c1.trained) return "p2";
  // h2h naming: trained_student vs base_student — already covered above.
  // Fallback: if exactly one mentions 'base', the other is the "sharper" side.
  if (c1.base && !c2.base) return "p2";
  if (c2.base && !c1.base) return "p1";
  return null; // non-h2h (scripted/random/parametric) — no trained/base story
}

// human game family from meta
function gameFamily(meta) {
  const m = meta || {};
  const g = String(m.game || "").toLowerCase();
  if (g === "koth") return "King of the Hill";
  const pols = (String(m.p1_policy) + " " + String(m.p2_policy)).toLowerCase();
  if (/target_knockback|_tk\b|ppo_tk/.test(pols)) return "Target Knockback";
  return "Ring-Out";
}
function gameKey(meta) {
  const f = gameFamily(meta);
  return f === "King of the Hill" ? "koth" : f === "Target Knockback" ? "tk" : "ringout";
}

// pretty name for a player slot
function slotLabel(meta, slot) {
  const ts = trainedSlot(meta);
  if (ts === slot) return "Trained Student";
  if (ts && ts !== slot) return "Base Student";
  // non-h2h — show raw policy nicely
  const pol = (meta || {})[slot + "_policy"] || slot.toUpperCase();
  return prettyPolicy(pol);
}
function prettyPolicy(p) {
  const s = String(p || "");
  return s
    .replace(/_/g, " ")
    .replace(/\bppo\b/i, "PPO")
    .replace(/\btk\b/i, "TK")
    .replace(/\bmodal\b/i, "Modal")
    .replace(/\bparametric\b/i, "Parametric")
    .replace(/\b(\w)/g, (m) => m.toUpperCase())
    .trim() || "—";
}

// outcome ('win'|'loss'|'draw') for a given slot, from meta.winner
function slotOutcome(meta, slot) {
  const w = String((meta || {}).winner || "draw").toLowerCase();
  if (w === "draw" || w === "none" || w === "") return "draw";
  return (w === slot) ? "win" : "loss";
}

// ===================================================================== dashboard lookup
function basename(p) { return String(p || "").split("/").pop(); }
let currentFilename = null; // basename of currently-loaded replay, for dashboard match

function dashboardEntryFor(filename) {
  if (!dashboard || !Array.isArray(dashboard.replays) || !filename) return null;
  const fn = basename(filename);
  return dashboard.replays.find((r) => basename(r.path) === fn) || null;
}

// ===================================================================== descriptive labels for dropdown
function describeReplay(meta, filename) {
  const m = meta || {};
  const fam = gameFamily(m);
  const ts = trainedSlot(m);
  const w = String(m.winner || "draw").toLowerCase();

  // outcome phrasing
  let outcome;
  if (w === "draw") outcome = "Draw";
  else if (ts) outcome = (w === ts) ? "Trained WINS" : "Base wins";
  else outcome = (w === "p1" ? "P1 wins" : w === "p2" ? "P2 wins" : "Draw");

  // matchup phrasing
  let matchup;
  if (ts) {
    const tSide = ts.toUpperCase();
    const bSide = (ts === "p1") ? "P2" : "P1";
    matchup = `Trained (${tSide}) vs Base (${bSide})`;
  } else {
    matchup = `${prettyPolicy(m.p1_policy)} vs ${prettyPolicy(m.p2_policy)}`;
  }

  let label = `${fam} · ${outcome} · ${matchup}`;
  const cfg = m.config;
  if (cfg && !/^h2h/i.test(String(cfg))) label += ` · ${cfg}`;
  return label;
}

let manifestEntries = []; // [{file, meta, label, key}]

async function fetchMeta(filename) {
  try {
    const res = await fetch(REPLAY_BASE + filename, { cache: "no-store" });
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.meta ? data.meta : (data ? {} : null);
  } catch (_) { return null; }
}

async function buildDropdown(files) {
  // fetch metas in parallel (best effort)
  const metas = await Promise.all(files.map(fetchMeta));
  manifestEntries = files.map((file, i) => {
    const meta = metas[i];
    if (meta === null) return null; // unreachable file — skip
    return { file, meta, label: describeReplay(meta, file), key: gameKey(meta) };
  }).filter(Boolean);

  // group by game family
  const groups = { koth: [], tk: [], ringout: [] };
  for (const e of manifestEntries) (groups[e.key] || groups.ringout).push(e);

  sel.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = "— pick a match —";
  sel.appendChild(ph);

  const titles = { ringout: "Ring-Out Duel", tk: "Target Knockback", koth: "King of the Hill" };
  for (const k of ["ringout", "tk", "koth"]) {
    const list = groups[k];
    if (!list || !list.length) continue;
    // h2h matches first within each group (the headline story)
    list.sort((a, b) => {
      const ha = /^h2h/i.test(String(a.meta.config)) ? 0 : 1;
      const hb = /^h2h/i.test(String(b.meta.config)) ? 0 : 1;
      return ha - hb || a.label.localeCompare(b.label);
    });
    const og = document.createElement("optgroup");
    og.label = titles[k];
    for (const e of list) {
      const o = document.createElement("option");
      o.value = e.file; o.textContent = e.label;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
}

function setReplay(data, filename) {
  if (!data || !Array.isArray(data.frames) || !data.frames.length) {
    loadErr.textContent = "Not a valid replay (no frames).";
    return;

  replay = data;
  currentFilename = filename ? basename(filename) : null;
  frame = 0;
  pause();
  scrub.max = data.frames.length - 1;
  scrub.value = 0;
  tagState.p1 = null; tagState.p2 = null;   // reset eased tag positions
  renderSpecPanels();
  hideVerdict();
  requestRender();
}

// ===================================================================== spec panels
function row(k, v, dim) {
  const dv = (v === undefined || v === null || v === "" ) ? "—" : v;
  const cls = (dv === "—" || dim) ? "v dimv" : "v";
  return `<div class="spec-row"><span class="k">${k}</span><span class="${cls}">${dv}</span></div>`;
}
function section(t) { return `<div class="spec-section">${t}</div>`; }

function renderSpecPanels() {
  if (!replay) return;
  const m = replay.meta || {};
  const dash = dashboardEntryFor(currentFilename);
  const ts = trainedSlot(m);
  const fam = gameFamily(m);

  // Decide which physical slot each panel describes.
  // LEFT panel = trained side when h2h; else P1. RIGHT = the other slot.
  const leftSlot  = ts ? ts : "p1";
  const rightSlot = leftSlot === "p1" ? "p2" : "p1";

  fillPanel("L", leftSlot,  m, dash, fam);
  fillPanel("R", rightSlot, m, dash, fam);
}

function fillPanel(side, slot, m, dash, fam) {
  const trained = trainedSlot(m) === slot;
  const isBase  = trainedSlot(m) && !trained;
  const color = trained ? getCSS("--trained") : isBase ? getCSS("--base")
              : (slot === "p1" ? getCSS("--trained") : getCSS("--base"));

  // role header: "Player 2 / Student" (calm, like the reference)
  $(side + "_dot").style.background = color;
  $(side + "_pslot").textContent = (slot === "p1" ? "Player 1" : "Player 2");
  $(side + "_role").textContent = "Student";
  $(side + "_name").textContent = slotLabel(m, slot);

  // sensei subline — short, like "by the good sensei"
  let senseiTxt;
  if (trained)      senseiTxt = "by the good sensei";
  else if (isBase)  senseiTxt = "by the base sensei";
  else              senseiTxt = prettyPolicy(m[slot + "_policy"]);
  $(side + "_sensei").textContent = senseiTxt;

  // avatar portrait (red/blue headband gi figure)
  drawAvatar(side + "_avatar", color, trained || (!isBase && slot === "p1"));

  // team pill (Trained / Base / raw policy)
